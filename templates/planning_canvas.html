<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Planning Canvas - NoodlePlanner</title>
    <style>
        body { font-family: sans-serif; }
        #canvas-container { display: flex; height: 90vh; }
        #product-list { width: 220px; background: #f7f7f7; border-right: 1px solid #ddd; padding: 1em; overflow-y: auto; }
    #canvas { flex: 1; position: relative; background: #f0f0f0; min-height: 100vh; }
        .node {
            position: absolute;
            min-width: 120px;
            min-height: 40px;
            background: #e3eaff;
            border: 2px solid #6c7ae0;
            border-radius: 8px;
            box-shadow: 0 2px 8px #0001;
            cursor: move;
            padding: 0.5em 1em;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            z-index: 2;
        }
        .node.group { background: #ffe3e3; border-color: #e06c6c; }
        .node .handles { width: 100%; display: flex; justify-content: space-between; margin-bottom: 2px; }
        .handle {
            width: 12px; height: 12px; background: #6c7ae0; border-radius: 50%; cursor: pointer; border: 2px solid #fff;
        }
        .node .label { font-weight: bold; margin: 2px 0; }
        .node .type { font-size: 0.8em; color: #666; }
        .connection {
            stroke: #6c7ae0;
            stroke-width: 3px;
            fill: none;
        }
    </style>
</head>
<body>
    <nav style="margin-bottom: 1em; display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center;">
            <a href="/projects" style="font-weight: bold; margin-right: 1em;">Projects</a>
            <a href="/projects/{{ project.id }}" style="margin-right: 1em;">Planning</a>
            <a href="/projects/{{ project.id }}/canvas" style="font-weight: bold;">Canvas</a>
        </div>
        <div style="display: flex; align-items: center; gap: 1em;">
            <span style="font-style: italic; color: #555;">{{ user.full_name or user.username }}</span>
            <form method="post" action="/logout" style="display:inline; margin-left:auto;">
                <button type="submit">Logout</button>
            </form>
        </div>
    </nav>
    <div id="canvas-container">
        <div id="product-list">
            <h3>Products</h3>
            <ul style="list-style:none; padding:0;">
            {% for product in project.products %}
                <li draggable="true" class="product-list-item" data-product-id="{{ product.id }}" data-type="{{ product.type or 'product' }}">{{ product.name }} <span style="font-size:0.8em; color:#888;">({{ product.type or 'product' }})</span></li>
            {% endfor %}
            </ul>
        </div>
        <div id="canvas">
            <svg id="connections" width="100%" height="100%" style="position:absolute;top:0;left:0;z-index:0;"></svg>
            <!-- Nodes will be rendered here by JS -->
        </div>
    </div>
    <script src="/static/canvas.js"></script>
</body>
</html>
