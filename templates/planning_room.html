<script>
// --- Product Details Side Panel Logic ---
const PRODUCT_FIELDS = [
    { key: 'name', label: 'Name' },
    { key: 'description', label: 'Description', textarea: true },
    { key: 'dependencies', label: 'Dependencies', textarea: true },
    { key: 'resources', label: 'Resources (People)', textarea: true },
    { key: 'skills', label: 'Skills', textarea: true },
    { key: 'derived_from', label: 'Derived From', textarea: true },
    { key: 'composed_of', label: 'Composed Of', textarea: true },
    { key: 'acceptance_criteria', label: 'Acceptance Criteria', textarea: true }
];
let selectedProductId = null;
function showProductDetails(product) {
    selectedProductId = product ? product.id : null;
    const panel = document.getElementById('product-details-panel');
    panel.style.display = 'flex';
    const fieldsDiv = document.getElementById('product-details-fields');
    fieldsDiv.innerHTML = '';
    if (!product) {
        fieldsDiv.innerHTML = '<div style="color:#888;">Select a product to edit details.</div>';
        return;
    }
    // Create a traditional webform
    const form = document.createElement('form');
    form.id = 'product-details-form';
    form.onsubmit = function(e) {
        e.preventDefault();
        // Save all fields at once
        const formData = new FormData(form);
        const payload = {};
        PRODUCT_FIELDS.forEach(f => {
            payload[f.key] = formData.get(f.key);
        });
        saveProductFields(payload);
    };
    PRODUCT_FIELDS.forEach(f => {
        const wrapper = document.createElement('div');
        wrapper.style.marginBottom = '0.7em';
        const label = document.createElement('label');
        label.textContent = f.label;
        label.setAttribute('for', 'product-field-' + f.key);
        label.style.fontWeight = 'bold';
        label.style.display = 'block';
        label.style.marginBottom = '0.2em';
        wrapper.appendChild(label);
        let input;
        if (f.textarea) {
            input = document.createElement('textarea');
            input.rows = 2;
            input.style.width = '100%';
        } else {
            input = document.createElement('input');
            input.type = 'text';
            input.style.width = '100%';
        }
        input.id = 'product-field-' + f.key;
        input.name = f.key;
        input.value = product[f.key] || '';
        wrapper.appendChild(input);
        form.appendChild(wrapper);
    });
    // Add a save button
    const saveBtn = document.createElement('button');
    saveBtn.type = 'submit';
    saveBtn.textContent = 'Save';
    saveBtn.style.marginTop = '0.5em';
    form.appendChild(saveBtn);
    fieldsDiv.appendChild(form);
}
function saveProductFields(payload) {
    if (!selectedProductId) return;
    fetch(`/projects/update-product-order/${selectedProductId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    }).then(() => {
        // Always update all-products-json before rendering nodes
        if (window.updateAllProductsJson) {
            window.updateAllProductsJson();
        }
        if (window.refreshProductJsonAndCanvas) {
            window.refreshProductJsonAndCanvas();
            setTimeout(() => {
                if (window.currentlySelectedProductId) {
                    selectProductById(window.currentlySelectedProductId);
                }
            }, 350);
        }
    });
}
function hideProductDetails() {
    document.getElementById('product-details-panel').style.display = 'none';
    selectedProductId = null;
}
document.addEventListener('DOMContentLoaded', function() {
    // Toggle/collapse panel
    document.getElementById('toggle-details-panel').onclick = function() {
        const panel = document.getElementById('product-details-panel');
        if (panel.style.right === '-320px') {
            panel.style.right = '0';
            panel.style.display = 'flex';
        } else {
            panel.style.right = '-320px';
            setTimeout(() => { panel.style.display = 'none'; }, 300);
        }
    };
    // Show message if no product is selected
    showProductDetails(null);
    // Select first product by default if available
    const products = JSON.parse(document.getElementById('all-products-json').textContent);
    if (products && products.length > 0) {
        window.currentlySelectedProductId = products[0].id;
        showProductDetails(products[0]);
    } else {
        window.currentlySelectedProductId = null;
    }

    // Register jsTree selection event handler here to ensure it always works
    $('#product-tree').on('select_node.jstree', function(e, data) {
        selectProductById(data.node.id);
    });

    // Register canvas node click event handler here to ensure it always works
    document.getElementById('canvas').addEventListener('click', function(e) {
        const node = e.target.closest('.node');
        if (node && node.dataset.productId) {
            selectProductById(node.dataset.productId);
        }
    });
});
// Listen for product selection from jsTree
function selectProductById(productId) {
    const products = JSON.parse(document.getElementById('all-products-json').textContent);
    const prod = products.find(p => String(p.id) === String(productId));
    if (prod) {
        window.currentlySelectedProductId = prod.id;
        showProductDetails(prod);
    }
}
// ...removed duplicate event handlers, now registered in DOMContentLoaded...
</script>

<script>
// Hamburger menu dropdown logic
$(function() {
    $('#hamburger-menu').on('click', function(e) {
        e.stopPropagation();
        $('#dropdown-menu').toggle();
    });
    $(document).on('click', function() {
        $('#dropdown-menu').hide();
    });
    $('#dropdown-menu').on('click', function(e) {
        e.stopPropagation();
    });
    // Export to CSV with indentation
    $('#export-csv').on('click', function(e) {
        e.preventDefault();
        var tree = $('#product-tree').jstree(true);
        // Get nodes in depth-first order with depth
        function getDepth(nodeId, tree) {
            var depth = 0;
            var node = tree.get_node(nodeId);
            while (node.parent && node.parent !== '#') {
                depth++;
                node = tree.get_node(node.parent);
            }
            return depth;
        }
        var nodes = tree.get_json('#', { flat: true });
        // Sort nodes in depth-first order
        function dfs(parentId, out) {
            tree.get_children_dom(parentId).each(function() {
                var nodeId = $(this).attr('id');
                var node = tree.get_node(nodeId);
                var depth = getDepth(nodeId, tree);
                out.push({
                    id: node.id,
                    name: node.text,
                    parent: node.parent,
                    depth: depth
                });
                dfs(nodeId, out);
            });
        }
        var ordered = [];
        dfs('#', ordered);
        var csv = 'id,name,parent_id\n';
        ordered.forEach(function(n) {
            var indented = '    '.repeat(n.depth) + n.name;
            csv += [n.id, '"' + indented.replace(/"/g, '""') + '"', n.parent === '#' ? '' : n.parent].join(',') + '\n';
        });
        var blob = new Blob([csv], { type: 'text/csv' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'product-list.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
    // Export to Excel (placeholder: just CSV for now)
    $('#export-excel').on('click', function(e) {
        e.preventDefault();
        // Download from backend endpoint
        var url = '/projects/{{ project.id }}/export-products-xlsx';
        var a = document.createElement('a');
        a.href = url;
        a.download = 'product-list.xlsx';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });
});
</script>

<script>
// Ensure the details panel is visible and positioned absolutely to the right
document.addEventListener('DOMContentLoaded', function() {
    const panel = document.getElementById('product-details-panel');
    panel.style.display = 'flex';
    panel.style.right = '0';
});
function updateAllProductsJson() {
    // Always refresh from backend to get all fields
    refreshProductJsonAndCanvas();
}

function refreshProductJsonAndCanvas() {
    $.get('/projects/{{ project.id }}', { ajax: 1 }, function(html) {
        var temp = document.createElement('div');
        temp.innerHTML = html;
        var newProductsJson = temp.querySelector('#products-json');
        var newAllProductsJson = temp.querySelector('#all-products-json');
        if (newProductsJson && newAllProductsJson) {
            document.getElementById('products-json').textContent = newProductsJson.textContent;
            document.getElementById('all-products-json').textContent = newAllProductsJson.textContent;
            if (window.renderNodes) window.renderNodes();
        }
    });
}

// Quick-add product form handler
$('#quick-add-product').on('submit', function(e) {
    e.preventDefault();
    var name = $('#quick-product-name').val().trim();
    if (!name) return;
    $.post('/projects/{{ project.id }}/products', { product_name: name }, function() {
        refreshProductJsonAndCanvas();
        location.reload();
    });
    $('#quick-product-name').val('');
});
$(function() {
    // Convert your flat product list to jsTree format
    function buildTree(products) {
        return products.map(function(prod) {
            return {
                id: prod.id.toString(),
                parent: prod.plan_id ? prod.plan_id.toString() : '#',
                text: prod.name
            };
        });
    }
    var products = JSON.parse(document.getElementById('products-json').textContent);
    $('#product-tree').jstree({
        'core': {
            'check_callback': true,
            'data': buildTree(products)
        },
        'plugins': ['dnd', 'contextmenu', 'unique', 'wholerow']
    });
    // Expand all nodes by default
    $('#product-tree').on('ready.jstree', function() {
        $('#product-tree').jstree('open_all');
    });
    // CREATE
    $('#product-tree').on('create_node.jstree', function(e, data) {
        $.post('/projects/{{ project.id }}/products', {
            product_name: data.node.text,
            parent_id: data.node.parent === '#' ? null : data.node.parent
        }).done(function(response) {
            refreshProductJsonAndCanvas();
            location.reload();
        });
    });

    // RENAME
    $('#product-tree').on('rename_node.jstree', function(e, data) {
        $.ajax({
            url: '/rename-product/' + data.node.id,
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ name: data.text }),
            success: function(response) {
                refreshProductJsonAndCanvas();
            }
        });
    });

    // DELETE
    $('#product-tree').on('delete_node.jstree', function(e, data) {
        $.post('/projects/delete-product/' + data.node.id)
            .done(function(response) {
                refreshProductJsonAndCanvas();
            });
    });

    // MOVE (drag-and-drop)
    $('#product-tree').on('move_node.jstree', function(e, data) {
        $.ajax({
            url: '/projects/update-product-parent/' + data.node.id,
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                plan_id: data.parent === '#' ? null : data.parent,
                sort_order: data.position + 1
            }),
            success: function(response) {
                // Update the all-products-json to match the new order and update canvas immediately
                updateAllProductsJson();
                setTimeout(function() {
                    if (window.renderNodes) window.renderNodes();
                }, 0);
                // Do NOT immediately refresh from backend, to avoid overwriting with stale data
            }
        });
    });
});
</script>
