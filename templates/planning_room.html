<script>
// --- Product Details Side Panel Logic ---
const PRODUCT_FIELDS = [
    { key: 'name', label: 'Name' },
    { key: 'description', label: 'Description', textarea: true },
    { key: 'dependencies', label: 'Dependencies', textarea: true },
    { key: 'resources', label: 'Resources (People)', textarea: true },
    { key: 'skills', label: 'Skills', textarea: true },
    { key: 'derived_from', label: 'Derived From', textarea: true },
    { key: 'composed_of', label: 'Composed Of', textarea: true },
    { key: 'acceptance_criteria', label: 'Acceptance Criteria', textarea: true }
];
let selectedProductId = null;
function showProductDetails(product) {
    selectedProductId = product ? product.id : null;
    const panel = document.getElementById('product-details-panel');
    panel.style.display = 'flex';
    const fieldsDiv = document.getElementById('product-details-fields');
    fieldsDiv.innerHTML = '';
    if (!product) {
        fieldsDiv.innerHTML = '<div style="color:#888;">Select a product to edit details.</div>';
        return;
    }
    // Create a traditional webform
    const form = document.createElement('form');
    form.id = 'product-details-form';
    form.onsubmit = function(e) {
        e.preventDefault();
        // Save all fields at once
        const formData = new FormData(form);
        const payload = {};
        PRODUCT_FIELDS.forEach(f => {
            payload[f.key] = formData.get(f.key);
        });
        // Save to backend (all fields)
        $.ajax({
            url: '/projects/update-product-order/' + product.id,
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            success: function() {
                if (window.updateAllProductsJson) window.updateAllProductsJson();
                setTimeout(function() {
                    if (window.renderNodes) window.renderNodes();
                    renderProductTree();
                }, 0);
            }
        });
    };
    PRODUCT_FIELDS.forEach(f => {
        const wrapper = document.createElement('div');
        wrapper.style.marginBottom = '0.7em';
        const label = document.createElement('label');
        label.textContent = f.label;
        label.setAttribute('for', 'product-field-' + f.key);
        label.style.fontWeight = 'bold';
        label.style.display = 'block';
        label.style.marginBottom = '0.2em';
        wrapper.appendChild(label);
        let input;
        if (f.textarea) {
            input = document.createElement('textarea');
            input.rows = 2;
            input.style.width = '100%';
        } else {
            input = document.createElement('input');
            input.type = 'text';
            input.style.width = '100%';
        }
        input.id = 'product-field-' + f.key;
        input.name = f.key;
        input.value = product[f.key] || '';
        wrapper.appendChild(input);
        form.appendChild(wrapper);
    });
    // Add a save button
    const saveBtn = document.createElement('button');
    saveBtn.type = 'submit';
    saveBtn.textContent = 'Save';
    form.appendChild(saveBtn);
    fieldsDiv.appendChild(form);
}

// Listen for product selection from jsTree
function selectProductById(productId) {
    const products = JSON.parse(document.getElementById('all-products-json').textContent);
    const prod = products.find(p => String(p.id) === String(productId));
    if (prod) {
        window.currentlySelectedProductId = prod.id;
        showProductDetails(prod);
    }
}
</script>
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- jsTree and jQuery -->

        <body>

                <button id="toggle-details-panel">&#9776;</button>

            </div>

<script>
// Tab switching logic (moved into script so it executes)
document.addEventListener('DOMContentLoaded', function() {
    const pbsTab = document.getElementById('pbs-tab');
    const flowTab = document.getElementById('flow-tab');
    const pbsMain = document.getElementById('pbs-main-content');
    const flowContainer = document.getElementById('flow-canvas-container');
    function activatePBS() {
        pbsTab.classList.add('active');
        flowTab.classList.remove('active');
        pbsTab.style.borderBottom = '2px solid #6c7ae0';
        flowTab.style.borderBottom = '2px solid transparent';
        pbsMain.style.display = '';
        flowContainer.style.display = 'none';
    }
    function activateFlow() {
        flowTab.classList.add('active');
        pbsTab.classList.remove('active');
        flowTab.style.borderBottom = '2px solid #6c7ae0';
        pbsTab.style.borderBottom = '2px solid transparent';
        pbsMain.style.display = 'none';
        flowContainer.style.display = '';
    }
    pbsTab.onclick = activatePBS;
    flowTab.onclick = activateFlow;
});
</script>
    <script src="/static/inline-rename.js"></script>
    <script src="/static/product-tree.js"></script>
    <script src="/static/selectable-product-list.js"></script>
    <script>
    // --- Render product tree using jsTree ---
    function getJsTreeDataFromProducts(products) {
        // Convert flat product list to jsTree format
        return products.map(function(p) {
            return {
                id: String(p.id),
                parent: p.plan_id == null ? '#' : String(p.plan_id),
                text: p.name,
                data: p
            };
        });
    }
    function renderProductTree() {
        var products = JSON.parse(document.getElementById('all-products-json').textContent);
        var treeData = getJsTreeDataFromProducts(products);
        var $tree = $('#product-tree');
        // Destroy previous tree if exists
        try { $tree.jstree('destroy'); } catch(e) {}
        $tree.jstree({
            core: {
                data: treeData,
                multiple: false,
                check_callback: true,
                themes: { stripes: true }
            },
            plugins: ['wholerow', 'dnd', 'contextmenu'],
            contextmenu: {
                items: function(node) {
                    return {
                        rename: {
                            label: 'Rename',
                            action: function() { $tree.jstree(true).edit(node); }
                        },
                        delete: {
                            label: 'Delete',
                            action: function() {
                                if (confirm('Delete this product?')) {
                                    $.post('/projects/delete-product/' + node.id, function() {
                                        if (window.updateAllProductsJson) window.updateAllProductsJson();
                                        setTimeout(function() {
                                            if (window.renderNodes) window.renderNodes();
                                            renderProductTree();
                                        }, 0);
                                    });
                                }
                            }
                        }
                    };
                }
            }
        })
        // Expand all nodes after ready
        .on('ready.jstree', function() {
            $tree.jstree('open_all');
        })
        // Handle drag-and-drop move events
        .on('move_node.jstree', function(e, data) {
            // Send AJAX to update parent and order
            $.ajax({
                url: '/projects/update-product-parent/' + data.node.id,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    plan_id: data.parent === '#' ? null : data.parent,
                    sort_order: data.position + 1
                }),
                success: function(response) {
                    if (window.updateAllProductsJson) window.updateAllProductsJson();
                    setTimeout(function() {
                        if (window.renderNodes) window.renderNodes();
                    }, 0);
                }
            });
        })
        // Handle selection to show product details
        .on('select_node.jstree', function(e, data) {
            var products = JSON.parse(document.getElementById('all-products-json').textContent);
            var prod = products.find(function(p) { return String(p.id) === String(data.node.id); });
            if (prod && window.showProductDetails) window.showProductDetails(prod);
        })
        // Handle rename event
        .on('rename_node.jstree', function(e, data) {
            $.ajax({
                url: '/rename-product/' + data.node.id,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ name: data.text }),
                success: function() {
                    if (window.updateAllProductsJson) window.updateAllProductsJson();
                    setTimeout(function() {
                        if (window.renderNodes) window.renderNodes();
                        renderProductTree();
                    }, 0);
                }
            });
        });
        // Optionally, re-attach any custom listeners here
        if (window.selectableProductListInit) window.selectableProductListInit();
        if (window.inlineRenameInit) window.inlineRenameInit();
    }
    document.addEventListener('DOMContentLoaded', function() {
        renderProductTree();
        // Fix: Add product form should refresh tree and canvas after submit
        var addForm = document.getElementById('quick-add-product');
        if (addForm) {
            addForm.addEventListener('submit', function(e) {
                e.preventDefault();
                var input = document.getElementById('quick-product-name');
                var name = input.value.trim();
                if (!name) return;
                $.post('/projects/{{ project.id }}/products', { product_name: name }, function() {
                    // Always fetch the latest products JSON and update tree/canvas
                    $.get('/projects/{{ project.id }}', { ajax: 1 }, function(html) {
                        var temp = document.createElement('div');
                        temp.innerHTML = html;
                        var newProductsJson = temp.querySelector('#all-products-json');
                        if (newProductsJson) {
                            document.getElementById('all-products-json').textContent = newProductsJson.textContent;
                        }
                        if (window.renderNodes) window.renderNodes();
                        renderProductTree();
                        input.value = '';
                    });
                });
            });
        }
    });
    window.renderProductTree = renderProductTree;
    </script>
</body>
<script>
// Ensure the details panel is visible and positioned absolutely to the right
document.addEventListener('DOMContentLoaded', function() {
    const panel = document.getElementById('product-details-panel');
    panel.style.display = 'flex';
    panel.style.right = '0';
});
function updateAllProductsJson() {
    // Always refresh from backend to get all fields
    refreshProductJsonAndCanvas();
}

function refreshProductJsonAndCanvas() {
    $.get('/projects/{{ project.id }}', { ajax: 1 }, function(html) {
        var temp = document.createElement('div');
        temp.innerHTML = html;
        var newProductsJson = temp.querySelector('#all-products-json');
        if (newProductsJson) {
            document.getElementById('all-products-json').textContent = newProductsJson.textContent;
        }
        if (window.renderNodes) window.renderNodes();
    });
}

// DELETE
$('#product-tree').on('delete_node.jstree', function(e, data) {
    $.post('/projects/delete-product/' + data.node.id)
        .done(function(response) {
            refreshProductJsonAndCanvas();
        });
});

// MOVE (drag-and-drop)
$('#product-tree').on('move_node.jstree', function(e, data) {
    $.ajax({
        url: '/projects/update-product-parent/' + data.node.id,
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            plan_id: data.parent === '#' ? null : data.parent,
            sort_order: data.position + 1
        }),
        success: function(response) {
            // Update the all-products-json to match the new order and update canvas immediately
            updateAllProductsJson();
            setTimeout(function() {
                if (window.renderNodes) window.renderNodes();
            }, 0);
            // Do NOT immediately refresh from backend, to avoid overwriting with stale data
        }
    });
});
</script>
</html>
