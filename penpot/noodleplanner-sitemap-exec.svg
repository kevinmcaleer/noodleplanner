<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <style>
    .title { font: 700 28px Arial, sans-serif; fill: #111827; }
    .subtitle { font: 400 16px Arial, sans-serif; fill: #4b5563; }
    .node { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 10; }
    .node2 { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 10; }
    .node3 { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 10; }
    .ext { fill: #f9fafb; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 6 6; rx: 10; }
    .label { font: 600 14px Arial, sans-serif; fill: #111827; }
    .line { stroke: #6b7280; stroke-width: 2; fill: none; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="40" y="50" class="title">NoodlePlanner — Executive Site Map</text>
  <text x="40" y="78" class="subtitle">Primary screens and major navigation paths</text>

  <rect class="node" x="730" y="120" width="300" height="60"/>
  <text class="label" x="790" y="157">/ (Main App)</text>

  <rect class="node2" x="120" y="280" width="260" height="56"/><text class="label" x="190" y="313">Backstage</text>
  <rect class="node2" x="440" y="280" width="260" height="56"/><text class="label" x="525" y="313">Portfolio</text>
  <rect class="node2" x="760" y="280" width="260" height="56"/><text class="label" x="845" y="313">Programme</text>
  <rect class="node2" x="1080" y="280" width="260" height="56"/><text class="label" x="1128" y="313">Project Workspace</text>
  <rect class="node2" x="1400" y="280" width="260" height="56"/><text class="label" x="1490" y="313">Search</text>

  <path class="line" marker-end="url(#arrow)" d="M 880 180 L 250 280"/>
  <path class="line" marker-end="url(#arrow)" d="M 880 180 L 570 280"/>
  <path class="line" marker-end="url(#arrow)" d="M 880 180 L 890 280"/>
  <path class="line" marker-end="url(#arrow)" d="M 880 180 L 1210 280"/>
  <path class="line" marker-end="url(#arrow)" d="M 880 180 L 1530 280"/>

  <rect class="node3" x="420" y="430" width="300" height="52"/><text class="label" x="525" y="462">Projects</text>
  <rect class="node3" x="420" y="500" width="300" height="52"/><text class="label" x="545" y="532">Status</text>
  <rect class="node3" x="420" y="570" width="300" height="52"/><text class="label" x="505" y="602">Team Allocation</text>
  <rect class="node3" x="420" y="640" width="300" height="52"/><text class="label" x="540" y="672">Timeline</text>
  <rect class="node3" x="420" y="710" width="300" height="52"/><text class="label" x="540" y="742">Actions</text>
  <rect class="node3" x="420" y="780" width="300" height="52"/><text class="label" x="555" y="812">Risks</text>
  <rect class="node3" x="420" y="850" width="300" height="52"/><text class="label" x="525" y="882">Look-Ahead</text>
  <rect class="node3" x="420" y="920" width="300" height="52"/><text class="label" x="525" y="952">Dependencies</text>
  <rect class="node3" x="420" y="990" width="300" height="52"/><text class="label" x="540" y="1022">Benefits</text>
  <rect class="node3" x="420" y="1060" width="300" height="52"/><text class="label" x="545" y="1092">Lessons</text>

  <path class="line" marker-end="url(#arrow)" d="M 570 336 L 570 430"/>

  <path class="line" marker-end="url(#arrow)" d="M 720 456 L 760 308"/>
  <path class="line" marker-end="url(#arrow)" d="M 720 456 L 1080 308"/>
  <path class="line" marker-end="url(#arrow)" d="M 1020 308 L 1080 308"/>

  <rect class="ext" x="980" y="430" width="300" height="56"/><text class="label" x="1058" y="463">/templates</text>
  <rect class="ext" x="980" y="510" width="300" height="56"/><text class="label" x="1018" y="543">/join/{session_id}</text>
  <rect class="ext" x="980" y="590" width="300" height="56"/><text class="label" x="1090" y="623">/docs</text>
</svg>
