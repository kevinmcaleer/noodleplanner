# Minimal YAML Schema for Projects (NoodlePlanner)
# This schema is designed for compact, keyless YAML structures like sample_plan2.yml
# It is compatible with YAML parsers and easy to import/export.

# Top-level: Project name (string)
# Value: List of phases (each phase is a mapping: phase name -> list of tasks)
# Each task is a sequence item, with optional inline metadata (duration, depends, t, etc)

# Example:
# ProjectName:
#   - PhaseName:
#     1. Task description, t: [date], d: duration, "assignee"
#     2. Next task, depends: [1]

# Schema (YAML, informal)
<project_name>:
  - <phase_name>:
    <task_number>. <task_description>[, <key>: <value>, ...]

# Supported inline keys (optional, comma-separated):
# - t: [ISO date(s)]
# - d: duration (ISO 8601, e.g. P7D)
# - depends: [task_number(s)]
# - assignee: "name"
# - duration: alias for d

# Example:
House move:
  - pre-move:
    1. find a new home, t: [2025-08-26], d: P14D, "Kevin, Jenni"
    2. pack belongings, depends: [1]
    3. hire movers, duration: "P7D", depends: [2]
    4. make an offer, depends: [3]
    5. get a mortgage, depends: [4]
    6. exchange contracts, depends: [5]

# Parsing notes:
# - Each task line starts with a number and dot (e.g. 1.)
# - Description is free text, followed by optional metadata (comma-separated)
# - Metadata keys are recognized by <key>: <value> pairs
# - Assignees can be quoted strings or comma-separated names
# - Dates must be ISO 8601 (YYYY-MM-DD)
# - Duration must be ISO 8601 (PnYnMnDTnHnMnS)
