# Provision a runner to the point where ci/run.sh can take over.
#
# This exists because the two kinds of runner arrive in different states. Our own
# image (ci/runner/) has uv, a pinned Python, Node 24 and a Chromium baked in, so
# there is nothing to do. A GitHub-hosted ubuntu-latest has Node and Chrome but
# no uv at all, so without this every job dies on ci/lib.sh's "uv is not
# installed" before running a single test.
#
# It is one composite action rather than a pair of steps in each job because
# that duplication is what the ci/ rewrite set out to remove: the old workflows
# repeated the same four setup steps across four jobs in three files. This is the
# one place a provisioning change has to be made.
#
# The split is deliberate: this action provisions the machine, ci/jobs/ defines
# the checks. Nothing here knows what is being tested, and nothing in ci/jobs/
# knows what kind of runner it is on.
name: Set up the NoodlePlanner toolchain
description: uv with Python 3.12 and Node 24, on our runners or GitHub's

runs:
  using: composite
  steps:
    # Both are no-ops beyond a cache hit on our own image, which already carries
    # them -- safe to run unconditionally rather than branching on runner type.
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
