# Markdown is the canonical plan format (issue #771). This guard fails the build
# if any change makes opening and saving an unedited plan alter it beyond the
# front-matter keys the app maintains. See docs/reference/plan-format.rst for
# the guarantee and tests/test_markdown_roundtrip.{py,mjs} for what is checked.
#
# The steps live in ci/jobs/roundtrip.sh so the same checks run from a terminal
# and from the pre-push hook. See ci/README.md.
name: Markdown round-trip guard

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roundtrip:
    # Set the CI_RUNS_ON repository variable to
    # ["self-hosted","linux","noodle"] to run this on our own runners -- see the
    # note in tests.yml for why GitHub-hosted is the fallback and not the goal.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ./ci/run.sh -j1 --strict roundtrip
