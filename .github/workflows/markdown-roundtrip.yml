# Markdown is the canonical plan format (issue #771). This guard fails the
# build if any change makes opening and saving an unedited plan alter it
# beyond the front-matter keys the app maintains. See
# docs/reference/plan-format.rst for the guarantee and
# tests/test_markdown_roundtrip.{py,mjs} for what is checked.
name: Markdown round-trip guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the workspace
        run: uv sync --all-packages

      - name: Server side — parse never rewrites an unedited plan
        run: uv run pytest tests/test_markdown_roundtrip.py -q -p no:cacheprovider

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Browser side — app-maintained keys are single-line, in-place edits
        run: node --test tests/test_markdown_roundtrip.mjs
