# Two engines schedule a plan: the Python one in noodle_core (used by the CLI
# and the server) and the JavaScript one in static/engine (used by the browser).
# They are kept honest by a shared corpus -- plans in, scheduled output out --
# and divergence fails the build. See issue #793 and tests/fixtures/conformance/.
#
# The steps live in ci/jobs/conformance.sh so the same checks run from a
# terminal and from the pre-push hook. See ci/README.md.
name: Engine conformance

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    # Set the CI_RUNS_ON repository variable to
    # ["self-hosted","linux","noodle"] to run this on our own runners -- see the
    # note in tests.yml for why GitHub-hosted is the fallback and not the goal.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ./ci/run.sh -j1 --strict conformance
