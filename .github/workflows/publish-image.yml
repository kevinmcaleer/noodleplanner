# Build and publish the container images when a PR merges to main.
#
# The nodes run these images (deploy/docker-compose.yml) and a Watchtower
# container on each node polls GHCR, so a merge reaches production a minute or
# two after this job finishes. See deploy/README.md for the node-side setup.
name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest main matters; a superseded build is wasted work.
concurrency:
  group: publish-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase.
  IMAGE_APP: ghcr.io/kevinmcaleer/noodleplanner
  IMAGE_DOCS: ghcr.io/kevinmcaleer/noodleplanner-docs

jobs:
  publish:
    name: build and push
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/arm64 as well as amd64, so the same image runs on Raspberry Pi
      # nodes. The layer cache lives in the registry, which keeps rebuilds
      # fast: only the source layers change on most merges.
      - name: App image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:main
            ${{ env.IMAGE_APP }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_APP }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_APP }}:buildcache,mode=max

      - name: Docs image
        uses: docker/build-push-action@v6
        with:
          context: docs
          file: docs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_DOCS }}:main
            ${{ env.IMAGE_DOCS }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_DOCS }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_DOCS }}:buildcache,mode=max
