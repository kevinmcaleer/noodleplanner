# The two full test suites, plus the browser suites.
#
# The job bodies are not here. Every step below is a one-line call into
# ci/jobs/, which is the same entry point the pre-push hook and a developer's
# terminal use -- see ci/README.md. Before that, these steps were the only
# written-down definition of CI, so reproducing a failure locally meant reading
# YAML and retyping it, and the uv/Node setup was copy-pasted across four jobs
# and three files.
name: Test suites

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever is still running for the same ref: these
# suites take minutes, and a superseded run tells you nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The runners are ours (ci/runner/), which is what takes these suites off the
# metered GitHub-hosted minutes this repository kept running out of -- minutes
# are not billed for self-hosted runners, even on a private repository.
#
# Set the CI_RUNS_ON repository variable to ["ubuntu-latest"] to fall back to
# GitHub-hosted runners without editing any of this: if the machine hosting the
# runners is down, jobs queue indefinitely rather than failing, and flipping a
# variable is a faster answer to that than three pull requests.
jobs:
  pytest:
    name: pytest
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","noodle"]') }}
    # Seconds, not minutes, now that the browser tests run in their own job: the
    # same suite that took ~19 minutes with them finishes in under a minute
    # without. The ceiling stays generous enough to absorb a busy runner, and
    # far below the six-hour default that would let a genuinely stuck job hold a
    # runner all day -- a job that is still running is also a job whose log
    # cannot be read, which is its own reason not to let one sit.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ./ci/run.sh -j1 --strict python

  usability:
    name: pytest (usability)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","noodle"]') }}
    # Reporting, not gating. 13 test files drive a browser and they skip wherever
    # none is reachable, so on a developer machine they silently skip and only
    # ever really run here -- which is how this workflow found 42 of them
    # asserting against a UI that no longer exists (no #projectTab, no
    # #projectSubnav). Deselecting them from the blocking job would have hidden
    # that, so they get their own job instead.
    #
    # continue-on-error means a red result here annotates the pull request
    # without blocking it. --strict is what makes a real failure red at all:
    # ci/run.sh would otherwise report it and exit 0, because `usability` is not in
    # its gating set. A genuine skip (no browser on the runner) still passes.
    #
    # Once the stale assertions are fixed, drop continue-on-error and add
    # `usability` to CI_BLOCKING_JOBS in ci/run.sh, and the job becomes a gate.
    #
    # The job id and check name are unchanged from before this rewrite on
    # purpose: they are what any required status check on `main` refers to, and a
    # renamed check does not fail, it simply never reports again.
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: ./ci/run.sh -j1 --strict usability

  js:
    name: npm run test:js
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux","noodle"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ./ci/run.sh -j1 --strict js
