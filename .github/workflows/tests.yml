# The two full test suites. The other workflows guard specific invariants --
# engine-conformance.yml that both scheduling engines agree, and
# markdown-roundtrip.yml that a plan survives a save -- but until this one
# existed nothing ran `pytest` or `npm run test:js` on a pull request, so a
# broken test only showed up when somebody ran it locally.
name: Test suites

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever is still running for the same ref: these
# suites take minutes, and a superseded run tells you nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    # Seconds, not minutes, now that the Selenium tests run in their own job
    # below: the same suite that took ~19 minutes with them finishes in under
    # a minute without. The ceiling stays generous enough to absorb a slow
    # runner, and far below the six-hour default that would let a genuinely
    # stuck job hold a runner all day -- a job that is still running is also a
    # job whose log cannot be read, which is its own reason not to let one sit.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the workspace
        run: uv sync --all-packages

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      # `-m "not usability"` is what keeps this job fast: it deselects the
      # Selenium tests, which are the entire difference between ~18 minutes
      # and ~18 seconds. They still run -- in the `usability` job below --
      # so the coverage isn't lost, just moved off the blocking path.
      #
      # This only works because every Selenium file now carries
      # `pytest.mark.usability`. Before, only tests/test_usability.py did, so
      # the switch deselected 30 tests out of 229 and looked broken. The
      # browser/Python Excel parity tests are non-usability pytest tests that
      # shell out to Node, so this job still installs the npm dev
      # dependencies they need.
      #
      # pytest.ini already puts -v in addopts, so a run killed on the timeout
      # names the test it stopped on rather than trailing off into dots.
      - name: Run the Python suite
        run: uv run pytest -p no:cacheprovider -m "not usability"

  usability:
    name: pytest (usability)
    runs-on: ubuntu-latest
    # Reporting, not gating. 13 test files drive Selenium and they skip
    # wherever no browser can be reached, so on a developer machine 229 tests
    # silently skip and only ever really run here -- which is how this
    # workflow found 42 of them asserting against a UI that no longer exists
    # (no #projectTab, no #projectSubnav). Deselecting them from the blocking
    # job would have hidden that, so they get their own job instead.
    #
    # continue-on-error means a red result here annotates the PR without
    # blocking it. Once the stale assertions are fixed, drop this line and the
    # job becomes a real gate.
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the workspace
        run: uv sync --all-packages

      - name: Run the Selenium suite
        run: uv run pytest -p no:cacheprovider -m usability

  js:
    name: npm run test:js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The browser libraries are vendored into static/vendor, but the tests
      # import the npm originals to check the two agree, so the dev
      # dependencies have to be installed.
      - name: Install dev dependencies
        run: npm ci

      - name: Run the JavaScript suites
        run: npm run test:js
