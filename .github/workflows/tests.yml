# The two full test suites. The other workflows guard specific invariants --
# engine-conformance.yml that both scheduling engines agree, and
# markdown-roundtrip.yml that a plan survives a save -- but until this one
# existed nothing ran `pytest` or `npm run test:js` on a pull request, so a
# broken test only showed up when somebody ran it locally.
name: Test suites

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever is still running for the same ref: these
# suites take minutes, and a superseded run tells you nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    # The whole suite is well under a minute of actual work. A job that runs
    # far past that is wedged, not slow, and the default six-hour ceiling
    # would sit there burning runner time -- fail fast instead, and read the
    # log to see which test it stopped on.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the workspace
        run: uv sync --all-packages

      # Verbose on purpose. Nothing here needs the extra output when it
      # passes, but if the job is killed on the timeout above, the last line
      # of the log is the test that hung -- which `-q` would not tell you.
      #
      # Note tests/test_usability.py does NOT skip here. It skips only where
      # Selenium cannot reach a browser, and GitHub's runners ship Chrome, so
      # its 50 tests really run, each against a uvicorn server of its own.
      - name: Run the Python suite
        run: uv run pytest -v -p no:cacheprovider

  js:
    name: npm run test:js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The browser libraries are vendored into static/vendor, but the tests
      # import the npm originals to check the two agree, so the dev
      # dependencies have to be installed.
      - name: Install dev dependencies
        run: npm ci

      - name: Run the JavaScript suites
        run: npm run test:js
