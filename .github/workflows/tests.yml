# The two full test suites, plus the browser suites.
#
# The job bodies are not here. Every step below is a one-line call into
# ci/jobs/, which is the same entry point the pre-push hook and a developer's
# terminal use -- see ci/README.md. Before that, these steps were the only
# written-down definition of CI, so reproducing a failure locally meant reading
# YAML and retyping it, and the uv/Node setup was copy-pasted across four jobs
# and three files.
name: Test suites

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever is still running for the same ref: these
# suites take minutes, and a superseded run tells you nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Where these jobs run is one repository variable, not a property of this file.
# Set CI_RUNS_ON to ["self-hosted","linux","noodle"] and they run on our own
# runners (ci/runner/), which is what takes them off the metered GitHub-hosted
# minutes this repository kept running out of -- minutes are not billed for
# self-hosted runners, even on a private repository. Unset, they run on
# ubuntu-latest.
#
# GitHub-hosted is the fallback rather than the goal, because the failure modes
# are not symmetric. A job with no matching runner does not fail, it queues
# forever -- so defaulting to self-hosted would mean that the moment this merged,
# every pull request and every push to main stopped being testable until the
# runner host happened to be up. Defaulting to ubuntu-latest costs minutes when
# the variable is unset, and nothing else. It also means this file can be merged
# before the runners exist, which is the situation it was written in.
#
# So: stand the runners up (ci/README.md), then set the variable. Unset it to
# get back to GitHub-hosted while the host is down or being rebuilt.
jobs:
  pytest:
    name: pytest
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    # Seconds, not minutes, now that the browser tests run in their own job: the
    # same suite that took ~19 minutes with them finishes in under a minute
    # without. The ceiling stays generous enough to absorb a busy runner, and
    # far below the six-hour default that would let a genuinely stuck job hold a
    # runner all day -- a job that is still running is also a job whose log
    # cannot be read, which is its own reason not to let one sit.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ./ci/run.sh -j1 --strict python

  usability:
    name: pytest (usability)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    # Only on runners we own. This job takes ~19 minutes where the four gating
    # jobs together take ~2, so on metered runners it is 89% of what a push
    # costs -- about 93 pushes a month against the free allowance, versus ~875
    # without it. Paying that for a job whose result cannot block a merge is
    # what exhausted the allowance in the first place, and it did so mid-run:
    # this workflow's own run on 68b9c1d never got a runner, and the Engine
    # conformance run created in the same second was refused at startup,
    # immediately after a 19-minute usability job had drained what was left.
    #
    # Minutes are not billed on self-hosted runners, so once CI_RUNS_ON points
    # at ours the suite runs on every push again, free. Unset, it is skipped
    # rather than silently dropped -- a skipped check is visible on the pull
    # request, and losing 19 minutes of reporting beats losing the ability to
    # run any CI at all.
    if: vars.CI_RUNS_ON != ''
    # Reporting, not gating. Ten test files still drive Selenium -- the other
    # three now live in tests/ui on Playwright, run by the `ui` job above. They
    # skip wherever no browser is reachable, so on a developer machine they
    # silently skip and only ever really run here -- which is how this workflow
    # found 42 of them asserting against a UI that no longer exists (no
    # #projectTab, no #projectSubnav). Deselecting them from the blocking job
    # would have hidden that, so they get their own job instead.
    #
    # continue-on-error means a red result here annotates the pull request
    # without blocking it. --strict is what makes a real failure red at all:
    # ci/run.sh would otherwise report it and exit 0, because `usability` is not in
    # its gating set. A genuine skip (no browser on the runner) still passes.
    #
    # Once the stale assertions are fixed, drop continue-on-error and add
    # `usability` to CI_BLOCKING_JOBS in ci/run.sh, and the job becomes a gate.
    #
    # The job id and check name are unchanged from before this rewrite on
    # purpose: they are what any required status check on `main` refers to, and a
    # renamed check does not fail, it simply never reports again.
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ./ci/run.sh -j1 --strict usability

  ui:
    name: pytest (ui)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    # A real gate, unlike `usability` below, because it is fast enough to block
    # on and green enough to mean something. On this runner the three ported
    # files cost ~135.7s under Selenium and ~43.5s here; see tests/ui/README.md
    # for where the difference comes from and what is left to port.
    #
    # No CI_RUNS_ON guard, unlike `usability`: at well under a minute it is not
    # what drains the allowance, and a gating job has to run wherever the gate
    # applies.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ./ci/run.sh -j1 --strict ui

  js:
    name: npm run test:js
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ./ci/run.sh -j1 --strict js

  design:
    name: design system
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    # Seconds, not minutes: both scripts read the CSS directly and neither
    # starts a browser. A gate, because the linter is a ratchet against a
    # committed baseline and so cannot fail on the ~1,950 violations that
    # already exist -- see ci/jobs/design.sh.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ./ci/run.sh -j1 --strict design
