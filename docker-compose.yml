services:
  noodleplanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noodleplanner
    ports:
      - "8007:8007"
    environment:
      - HOST=0.0.0.0
      - PORT=8007
      - MAX_FILE_SIZE=1048576
      - RELOAD=true
      - ENABLE_ACTIVITY_LOGGING=false
    command: ["uv", "run", "uvicorn", "noodle_web.app:app", "--host", "0.0.0.0", "--port", "8007", "--reload", "--reload-dir", "/app/packages"]
    volumes:
      # Mount packages for development (optional - comment out for production)
      - ./packages:/app/packages
      - ./templates:/app/templates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    container_name: noodleplanner-docs
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: noodleplanner-tunnel
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - noodleplanner
      - docs
    restart: unless-stopped
