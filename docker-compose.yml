services:
  noodleplanner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Change this value to force rebuild of app code layer
        # Example: CACHEBUST=2, CACHEBUST=3, or use date +%s
        CACHEBUST: 60
    container_name: noodleplanner
    ports:
      - "8007:8007"
    environment:
      - HOST=0.0.0.0
      - PORT=8007
      - MAX_FILE_SIZE=1048576
      - RELOAD=false
      - DATABASE_URL=${DATABASE_URL}
      - ENABLE_ACTIVITY_LOGGING=${ENABLE_ACTIVITY_LOGGING:-true}
    volumes:
      # Mount local directory for development (optional - comment out for production)
      - ./projects:/app/projects
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
