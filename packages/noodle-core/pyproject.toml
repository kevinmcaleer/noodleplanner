[project]
name = "noodle-core"
version = "1.0.0"
description = "Core scheduling engine for Noodle Planner"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "numpy>=1.24.0,<2.3.0",
    "pandas>=2.0.0,<2.3.0",
    "python-dateutil>=2.9.0",
    "python-pptx",
    "reportlab",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "olefile>=0.46",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
mpp = [
    "pymppwriter>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noodle_core"]
