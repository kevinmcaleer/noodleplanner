[project]
name = "noodle-cli"
version = "1.0.0"
description = "Command-line interface for Noodle Planner"
requires-python = ">=3.11"
dependencies = [
    "noodle-core",
]

[tool.uv.sources]
noodle-core = { workspace = true }

[project.scripts]
noodle = "noodle_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noodle_cli"]
