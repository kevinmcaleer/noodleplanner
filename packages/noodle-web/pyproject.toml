[project]
name = "noodle-web"
version = "1.0.0"
description = "Web application for Noodle Planner"
requires-python = ">=3.11"
dependencies = [
    "noodle-core",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.2.1",
    "pyjwt>=2.10.1",
]

[tool.uv.sources]
noodle-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noodle_web"]

[tool.hatch.build.targets.wheel.force-include]
"src/noodle_web/static" = "noodle_web/static"
"src/noodle_web/templates" = "noodle_web/templates"
