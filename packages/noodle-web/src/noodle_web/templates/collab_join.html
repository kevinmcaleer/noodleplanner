<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join planning session - Noodle Planner</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script>
    // The app's theme choice, so a joiner who also uses NoodlePlanner sees
    // the board in the theme they picked there -- same as index.html.
    (function() {
        var choice = 'light';
        try { choice = localStorage.getItem('np-theme-choice') || 'light'; } catch (e) { /* storage blocked */ }
        var theme = choice;
        if (choice === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@300;400;500&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- #1347: the host's own whiteboard stylesheets, so a joiner's notes
         look exactly like the host's. -->
    <link rel="stylesheet" href="/static/base.css?v={{ v }}">
    <link rel="stylesheet" href="/static/components.css?v={{ v }}">
    <link rel="stylesheet" href="/static/views/whiteboard.css?v={{ v }}">
    <link rel="stylesheet" href="/static/task-peek.css?v={{ v }}">
    <link rel="stylesheet" href="/static/dark-mode.css?v={{ v }}">
    <link rel="stylesheet" href="/static/visual-system.css?v={{ v }}">
    <link rel="stylesheet" href="/static/animations.css?v={{ v }}">
    <link rel="stylesheet" href="/static/collab-chat.css?v={{ v }}">
    <link rel="stylesheet" href="/static/views/collab-join.css?v={{ v }}">
</head>
<body class="collab-join">
    <main class="join-screen" id="joinScreen">
        <div class="join-card">
            <h1>Join planning session</h1>
            <p class="join-sub">Enter the six-digit code your PM shared with you.</p>

            <form id="joinForm">
                <label for="joinCode">Session code</label>
                <input id="joinCode" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required>

                <label for="displayName">Your name</label>
                <input id="displayName" name="display_name" maxlength="100" placeholder="Alex" required>

                <button type="submit" id="joinBtn" class="join-btn join-btn-primary">Join session</button>
            </form>
            <div id="status" role="status"></div>
        </div>
    </main>

    <div class="session-shell" id="relay" hidden>
        <header class="session-bar">
            <div class="session-title">
                <i class="bi bi-people" aria-hidden="true"></i>
                <strong>Planning session</strong>
                <span class="session-who" id="sessionWho"></span>
            </div>
            <div class="session-notice" id="planNotice" role="status" hidden></div>
            <div class="session-actions">
                <button type="button" class="join-btn" id="chatToggle" aria-controls="chatPanel" aria-expanded="true" title="Hide the session chat">
                    <i class="bi bi-chat-dots" aria-hidden="true"></i>
                    <span>Chat</span>
                    <span class="session-unread" id="chatUnread" hidden></span>
                </button>
                <button type="button" class="join-btn join-btn-danger" id="leaveBtn">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                    <span>Leave session</span>
                </button>
            </div>
        </header>

        <div class="session-main">
            <section class="session-board" aria-label="Whiteboard">
                {% with wb_active = true %}{% include "_whiteboard_view.html" %}{% endwith %}
            </section>

            <aside class="session-chat" id="chatPanel" aria-label="Session chat">
                <header class="session-chat-header">
                    <h2>Session chat</h2>
                    <div class="session-chat-actions">
                        <button type="button" class="session-icon-btn" id="relayDownload" title="Download chat" aria-label="Download chat">
                            <i class="bi bi-download" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="session-icon-btn" id="chatCollapse" title="Hide the session chat" aria-label="Hide the session chat">
                            <i class="bi bi-chevron-bar-right" aria-hidden="true"></i>
                        </button>
                    </div>
                </header>
                <div class="session-chat-list" id="relayLog" aria-live="polite"></div>
                <form class="session-chat-composer" id="relayForm">
                    <input id="relayInput" maxlength="2000" autocomplete="off" placeholder="Message the session" aria-label="Chat message">
                    <button type="submit" id="relaySend" title="Send message" aria-label="Send message">
                        <i class="bi bi-send" aria-hidden="true"></i>
                    </button>
                </form>
            </aside>
        </div>
    </div>

    <!-- The host's plan text, as the whiteboard scripts expect to find it.
         Never shown, and never saved: a joiner holds no copy of the plan. -->
    <textarea id="planEditor" hidden aria-hidden="true" tabindex="-1"></textarea>

    <script src="/static/state.js?v={{ v }}"></script>
    <script src="/static/task-tokenizer.js?v={{ v }}"></script>
    <script src="/static/plan-model.js?v={{ v }}"></script>
    <script src="/static/editor-sync.js?v={{ v }}"></script>
    <script src="/static/script.js?v={{ v }}"></script>
    <script src="/static/kanban.js?v={{ v }}"></script>
    <script src="/static/mindmap.js?v={{ v }}"></script>
    <script src="/static/whiteboard.js?v={{ v }}"></script>
    <script src="/static/task-peek.js?v={{ v }}"></script>
    <script src="/static/whiteboard-structure.js?v={{ v }}"></script>
    <script src="/static/whiteboard-notes.js?v={{ v }}"></script>
    <script src="/static/whiteboard-groups.js?v={{ v }}"></script>
    <script src="/static/whiteboard-object-toolbar.js?v={{ v }}"></script>
    <script src="/static/whiteboard-noodles.js?v={{ v }}"></script>
    <script src="/static/whiteboard-dep-noodles.js?v={{ v }}"></script>
    <script src="/static/whiteboard-outline.js?v={{ v }}"></script>
    <script src="/static/collab-chat.js?v={{ v }}"></script>
    <script src="/static/collab-merge.js?v={{ v }}"></script>
    <script src="/static/collab-join.js?v={{ v }}"></script>
    <script type="module" src="/static/components/close-button/np-close-button.js?v={{ v }}"></script>
    <script type="module" src="/static/components/empty-state/np-empty-state.js?v={{ v }}"></script>
    <script type="module" src="/static/components/button/np-button.js?v={{ v }}"></script>
    <script type="module" src="/static/components/checkbox/np-checkbox.js?v={{ v }}"></script>
    <script type="module" src="/static/components/resource-stack/np-resource-stack.js?v={{ v }}"></script>
    <script type="module" src="/static/components/note/note-markup.js?v={{ v }}"></script>
</body>
</html>
