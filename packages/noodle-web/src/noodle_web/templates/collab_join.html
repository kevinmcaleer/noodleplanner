<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join planning session - Noodle Planner</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --muted: #6b7280;
            --border: #d8dce1;
            --accent: #667eea;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14161a;
                --card-bg: #1e2126;
                --text: #eef0f3;
                --muted: #9aa1ab;
                --border: #33373f;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }
        h1 { font-size: 1.4rem; margin: 0 0 4px; }
        p.sub { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--muted); }
        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            font-size: 1rem;
        }
        input#joinCode { letter-spacing: 0.3em; font-variant-numeric: tabular-nums; }
        button {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: default; }
        #status { margin-top: 16px; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
        #relay { margin-top: 20px; display: none; }
        #relayLog {
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 140px;
            overflow-y: auto;
            padding: 8px;
            font-size: 0.8rem;
            font-family: ui-monospace, monospace;
        }
        .row { display: flex; gap: 8px; margin-top: 8px; }
        .row input { margin-bottom: 0; }
        .row button { width: auto; padding: 8px 14px; }

        /* #967 live plan */
        #planTasks { border: 1px solid var(--border); border-radius: 8px; max-height: 260px; overflow-y: auto; }
        .plan-task {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 0.9rem;
        }
        .plan-task:last-child { border-bottom: none; }
        .plan-task-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
        .plan-task-name[contenteditable="true"]:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
        .plan-task-percent { width: 62px; margin-bottom: 0; padding: 4px 6px; font-size: 0.85rem; }
        .plan-task-done { color: var(--muted); text-decoration: line-through; }
        .plan-empty { padding: 10px 8px; color: var(--muted); font-size: 0.85rem; }
        #planNotice {
            margin-top: 12px; padding: 8px 10px; border-radius: 8px;
            background: rgba(217, 119, 6, 0.12); color: #b45309; font-size: 0.85rem;
        }
        @media (prefers-color-scheme: dark) { #planNotice { color: #fbbf24; } }

        /* #969 RAID/risk log */
        h2.section-heading {
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--muted); margin: 20px 0 6px;
        }
        #raidRows { border: 1px solid var(--border); border-radius: 8px; max-height: 220px; overflow-y: auto; }
        .raid-row {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 0.85rem;
        }
        .raid-row:last-child { border-bottom: none; }
        .raid-row-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
        .raid-row-title[contenteditable="true"]:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
        .raid-row-type, .raid-row-status {
            border: 1px solid var(--border); border-radius: 6px; background: transparent;
            color: var(--text); font-size: 0.8rem; padding: 3px 4px;
        }
        .raid-row-delete {
            width: auto; padding: 2px 8px; border-radius: 6px;
            background: transparent; border: 1px solid var(--border); color: var(--muted);
        }

        /* #1036: the generic section rows use <input> for their extra
           fields where RAID uses <select>. This page sets `input { width:
           100% }` globally, so without an override two of them expand and
           squeeze the flex:1 title to zero width -- the row renders looking
           like the title is missing entirely. */
        .section-row-input {
            width: auto;
            max-width: 110px;
            flex: 0 0 auto;
            margin-bottom: 0;
            border: 1px solid var(--border); border-radius: 6px; background: transparent;
            color: var(--text); font-size: 0.8rem; padding: 3px 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Join planning session</h1>
        <p class="sub">Enter the six-digit code your PM shared with you.</p>

        <form id="joinForm">
            <label for="joinCode">Session code</label>
            <input id="joinCode" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required>

            <label for="displayName">Your name</label>
            <input id="displayName" name="display_name" maxlength="100" placeholder="Alex" required>

            <button type="submit" id="joinBtn">Join session</button>
        </form>
        <div id="status"></div>

        <div id="relay">
            <!-- #967: the live plan. Every control here sends an edit
                 intent to the host and waits for the snapshot that comes
                 back -- this page never edits a plan of its own. -->
            <div id="planNotice" hidden></div>
            <div id="planTasks"></div>
            <div class="row">
                <input id="newTaskName" placeholder="Add a task">
                <button type="button" id="addTaskBtn">Add</button>
            </div>

            <!-- #969: the RAID/risk log, edited via the same host-authoritative
                 op model as the task outline above (see collab-backmatter-ops.js)
                 -- this page never edits the log directly, only sends intents. -->
            <h2 class="section-heading">RAID / risk log</h2>
            <div id="raidRows"></div>
            <div class="row">
                <input id="newRaidTitle" placeholder="Add a risk, action, issue or decision">
                <button type="button" id="addRaidBtn">Add</button>
            </div>

            <!-- #1036: the other editable back-matter sections, driven by
                 the same host-authoritative op model as the RAID log. -->
            <h2 class="section-heading">Benefits</h2>
            <div id="benefitsRows"></div>
            <div class="row">
                <input id="newBenefitsTitle" placeholder="Add a benefit">
                <button type="button" id="addBenefitsBtn">Add</button>
            </div>

            <h2 class="section-heading">Comms plan</h2>
            <div id="commsRows"></div>
            <div class="row">
                <input id="newCommsTitle" placeholder="Add a comms activity">
                <button type="button" id="addCommsBtn">Add</button>
            </div>

            <div id="relayLog"></div>
            <div class="row">
                <input id="relayInput" placeholder="Send a message to the host">
                <button type="button" id="relaySend">Send</button>
            </div>
        </div>
    </div>

    <script>
        // #964: end-to-end encryption. This inline script stays a classic
        // (non-module) script, so static/collab-crypto.js (an ES module)
        // is loaded via dynamic import() -- same pattern collab-session.js
        // and ribbon.js use for their own ES-module dependencies. See
        // collab-crypto.js's module docstring for the full crypto design
        // (KDF, key exchange, AEAD, wire format, and the two-secret design:
        // the six-digit `code` below is admission-only -- it is what the
        // server checks to let this socket's `join` handshake through, and
        // has zero cryptographic role. The ECDH handshake is instead
        // authenticated by `handshakeSecret`, read below from this page's
        // own URL fragment, which browsers never send to any server).
        let cryptoModulePromise = null;
        function loadCollabCrypto() {
            if (!cryptoModulePromise) cryptoModulePromise = import('/static/collab-crypto.js');
            return cryptoModulePromise;
        }

        // The holding link the host shares is `/join/{session_id}#k=<secret>`
        // (see collab_session.py) -- `window.location.hash` is populated by
        // the browser from that fragment and is never part of any request
        // this page (or any page) sends to a server.
        function parseHandshakeSecretFromHash() {
            const hash = window.location.hash || '';
            const params = new URLSearchParams(hash.replace(/^#/, ''));
            return params.get('k');
        }
        const handshakeSecret = parseHandshakeSecretFromHash();

        const sessionId = {{ session_id | tojson }};
        const form = document.getElementById('joinForm');
        const status = document.getElementById('status');
        const joinBtn = document.getElementById('joinBtn');
        const relay = document.getElementById('relay');
        const relayLog = document.getElementById('relayLog');

        function log(line) {
            const div = document.createElement('div');
            div.textContent = line;
            relayLog.appendChild(div);
            relayLog.scrollTop = relayLog.scrollHeight;
        }

        // ---- #967: live plan editing -------------------------------------

        /** Show a transient message -- the "X also edited this" notice from
         * the host's conflict rule, or an explanation for a bounced op. */
        function showPlanNotice(text) {
            const notice = document.getElementById('planNotice');
            if (!notice || !text) return;
            notice.textContent = text;
            notice.hidden = false;
            clearTimeout(planNoticeTimer);
            planNoticeTimer = setTimeout(() => { notice.hidden = true; }, 6000);
        }

        /** Send an edit intent to the host, encrypted like any other
         * content. The host decides whether it applies -- nothing is
         * changed locally first, so this page can never show an edit that
         * the plan does not actually have (no optimistic-update drift). */
        async function sendPlanOp(op) {
            if (!socket || socket.readyState !== WebSocket.OPEN || !sessionKey) return;
            const { encryptMessage } = await loadCollabCrypto();
            const envelope = await encryptMessage(
                sessionKey, JSON.stringify({ type: 'plan_op', rev: planRev, ...op }), sessionId
            );
            socket.send(envelope);
        }

        /** Render the host's snapshot. Rebuilt wholesale each time: the
         * host is the only writer, so there is no local state worth
         * preserving across a snapshot, and rebuilding keeps this page
         * incapable of drifting from the host's plan. */
        function renderPlanSnapshot(snapshot) {
            planTasks = Array.isArray(snapshot.tasks) ? snapshot.tasks : [];
            planRev = snapshot.rev;
            if (snapshot.notice) showPlanNotice(snapshot.notice);

            const container = document.getElementById('planTasks');
            if (!container) return;
            container.innerHTML = '';

            if (planTasks.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'plan-empty';
                empty.textContent = 'The host has not written any tasks yet.';
                container.appendChild(empty);
                return;
            }

            for (const task of planTasks) {
                const row = document.createElement('div');
                row.className = 'plan-task';
                row.style.paddingLeft = `${8 + task.indent * 8}px`;

                const name = document.createElement('span');
                name.className = 'plan-task-name' + (task.done ? ' plan-task-done' : '');
                name.textContent = task.name;
                name.contentEditable = 'true';
                name.spellcheck = false;
                // Commit on blur or Enter, never per keystroke: an op per
                // character would put the host into a rename storm and make
                // every concurrent edit look like a conflict.
                name.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') { event.preventDefault(); name.blur(); }
                    if (event.key === 'Escape') { name.textContent = task.name; name.blur(); }
                });
                name.addEventListener('blur', () => {
                    const value = name.textContent.trim();
                    if (!value || value === task.name) { name.textContent = task.name; return; }
                    sendPlanOp({ op: 'rename', id: task.id, expect: task.name, value });
                });
                row.appendChild(name);

                const percent = document.createElement('input');
                percent.type = 'number';
                percent.min = '0';
                percent.max = '100';
                percent.className = 'plan-task-percent';
                percent.value = task.percent == null ? '' : String(task.percent);
                percent.placeholder = '–';
                percent.addEventListener('change', () => {
                    const value = Number(percent.value);
                    if (!Number.isFinite(value)) return;
                    sendPlanOp({ op: 'set_percent', id: task.id, expect: task.name, value });
                });
                row.appendChild(percent);

                container.appendChild(row);
            }
        }

        // #969: the RAID/risk log, following the exact same "send an intent,
        // render what the host sends back" pattern as sendPlanOp/
        // renderPlanSnapshot above -- see collab-backmatter-ops.js for the
        // row-op protocol and why it's scoped to RAID for now. */
        async function sendBackmatterOp(op) {
            if (!socket || socket.readyState !== WebSocket.OPEN || !sessionKey) return;
            const { encryptMessage } = await loadCollabCrypto();
            const envelope = await encryptMessage(
                sessionKey, JSON.stringify({ type: 'backmatter_op', section: 'raid', rev: raidRev, ...op }), sessionId
            );
            socket.send(envelope);
        }

        // ---- #1036: benefits and comms ----------------------------------
        //
        // Same intent-and-snapshot pattern as RAID above, but driven by a
        // small per-section description rather than a hand-written renderer
        // each: these two are structurally identical id-keyed tables, so a
        // third would be a row in this object, not another block of code.
        const SECTION_UI = {
            benefits: {
                heading: 'Benefits',
                placeholder: 'Add a benefit',
                // The first column is what a person actually scans for.
                titleField: 'title',
                extraFields: ['status'],
            },
            comms: {
                heading: 'Comms plan',
                placeholder: 'Add a comms activity',
                titleField: 'activity',
                extraFields: ['audience', 'channel'],
            },
        };

        const sectionState = {};
        for (const name of Object.keys(SECTION_UI)) sectionState[name] = { rows: [], rev: 0 };

        async function sendSectionOp(section, op) {
            if (!socket || socket.readyState !== WebSocket.OPEN || !sessionKey) return;
            const { encryptMessage } = await loadCollabCrypto();
            const envelope = await encryptMessage(
                sessionKey,
                JSON.stringify({
                    type: 'backmatter_op', section, rev: sectionState[section].rev, ...op,
                }),
                sessionId
            );
            socket.send(envelope);
        }

        /** Render one back-matter section's snapshot. Rebuilt wholesale for
         * the same reason the plan and RAID renderers are: the host owns the
         * document, so there is no local state worth preserving. */
        function renderSectionSnapshot(snapshot) {
            const section = snapshot.section;
            const config = SECTION_UI[section];
            if (!config) return;

            sectionState[section].rows = Array.isArray(snapshot.items) ? snapshot.items : [];
            sectionState[section].rev = snapshot.rev;
            if (snapshot.notice) showPlanNotice(snapshot.notice);

            const container = document.getElementById(`${section}Rows`);
            if (!container) return;
            container.innerHTML = '';

            if (sectionState[section].rows.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'plan-empty';
                empty.textContent = 'Nothing here yet.';
                container.appendChild(empty);
                return;
            }

            for (const row of sectionState[section].rows) {
                const el = document.createElement('div');
                el.className = 'raid-row';

                const title = document.createElement('span');
                title.className = 'raid-row-title';
                title.textContent = row[config.titleField] || '';
                title.contentEditable = 'true';
                title.spellcheck = false;
                title.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') { event.preventDefault(); title.blur(); }
                    if (event.key === 'Escape') { title.textContent = row[config.titleField] || ''; title.blur(); }
                });
                title.addEventListener('blur', () => {
                    const value = title.textContent.trim();
                    if (value === (row[config.titleField] || '')) return;
                    sendSectionOp(section, {
                        op: 'edit_row', row_id: row.id, fields: { [config.titleField]: value },
                    });
                });
                el.appendChild(title);

                for (const field of config.extraFields) {
                    const input = document.createElement('input');
                    input.className = 'section-row-input';
                    input.value = row[field] || '';
                    input.placeholder = field;
                    input.addEventListener('change', () => {
                        sendSectionOp(section, {
                            op: 'edit_row', row_id: row.id, fields: { [field]: input.value },
                        });
                    });
                    el.appendChild(input);
                }

                const remove = document.createElement('button');
                remove.type = 'button';
                remove.className = 'raid-row-delete';
                remove.textContent = '×';
                remove.title = 'Delete';
                remove.addEventListener('click', () => {
                    sendSectionOp(section, { op: 'delete_row', row_id: row.id });
                });
                el.appendChild(remove);

                container.appendChild(el);
            }
        }

        /** Render the host's RAID snapshot. Rebuilt wholesale each time, for
         * the same reason renderPlanSnapshot is: the host is the only writer
         * of the plan text the RAID log lives in. */
        function renderRaidSnapshot(snapshot) {
            raidRows = Array.isArray(snapshot.items) ? snapshot.items : [];
            raidRev = snapshot.rev;
            if (snapshot.notice) showPlanNotice(snapshot.notice);

            const container = document.getElementById('raidRows');
            if (!container) return;
            container.innerHTML = '';

            if (raidRows.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'plan-empty';
                empty.textContent = 'No RAID log items yet.';
                container.appendChild(empty);
                return;
            }

            for (const row of raidRows) {
                const el = document.createElement('div');
                el.className = 'raid-row';

                const title = document.createElement('span');
                title.className = 'raid-row-title';
                title.textContent = row.title || row.description || '(untitled)';
                title.contentEditable = 'true';
                title.spellcheck = false;
                title.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') { event.preventDefault(); title.blur(); }
                    if (event.key === 'Escape') { title.textContent = row.title; title.blur(); }
                });
                title.addEventListener('blur', () => {
                    const value = title.textContent.trim();
                    if (!value || value === row.title) { title.textContent = row.title; return; }
                    sendBackmatterOp({ op: 'edit_row', row_id: row.id, fields: { title: value } });
                });
                el.appendChild(title);

                const type = document.createElement('select');
                type.className = 'raid-row-type';
                ['risk', 'action', 'issue', 'decision', 'dependency'].forEach((t) => {
                    const opt = document.createElement('option');
                    opt.value = t;
                    opt.textContent = t;
                    if (t === row.type) opt.selected = true;
                    type.appendChild(opt);
                });
                type.addEventListener('change', () => {
                    sendBackmatterOp({ op: 'edit_row', row_id: row.id, fields: { type: type.value } });
                });
                el.appendChild(type);

                const status = document.createElement('select');
                status.className = 'raid-row-status';
                ['open', 'closed', 'transferred'].forEach((s) => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = s;
                    if (s === row.status) opt.selected = true;
                    status.appendChild(opt);
                });
                status.addEventListener('change', () => {
                    sendBackmatterOp({ op: 'edit_row', row_id: row.id, fields: { status: status.value } });
                });
                el.appendChild(status);

                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'raid-row-delete';
                del.textContent = '×';
                del.title = 'Delete';
                del.addEventListener('click', () => {
                    sendBackmatterOp({ op: 'delete_row', row_id: row.id });
                });
                el.appendChild(del);

                container.appendChild(el);
            }
        }

        let socket = null;
        let connectKey = null;
        let keyPair = null;
        let sessionKey = null; // established once the host's pubkey is verified
        let presencePingTimer = null;

        // #967: the last plan the host sent. This page holds no plan of its
        // own -- it renders what the host says and asks the host to change
        // it. `planRev` is echoed back on every op purely so the host can
        // tell how current the sender's view was.
        let planTasks = [];
        let planRev = 0;
        let planNoticeTimer = null;

        // #969: same contract as planTasks/planRev, for the RAID log.
        let raidRows = [];
        let raidRev = 0;

        // #966: how often this joiner tells the host it's still here, via
        // the lightweight `{"type": "presence_ping"}` heartbeat -- kept
        // well under collab_session.py's PRESENCE_ACTIVE_WINDOW_SECONDS
        // (45s by default) so a couple of missed beats (a backgrounded
        // tab, a slow network) don't flip this joiner to "inactive" in the
        // host's presence panel.
        const PRESENCE_PING_INTERVAL_MS = 15000;

        function stopPresencePing() {
            if (presencePingTimer !== null) {
                clearInterval(presencePingTimer);
                presencePingTimer = null;
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            // Fail closed: without the fragment secret this page cannot
            // authenticate the ECDH handshake at all (see the module
            // docstring note above and collab-crypto.js's for why using
            // `code` here instead would be a serious security bug). Don't
            // even attempt to connect.
            if (!handshakeSecret) {
                status.textContent = 'This join link is missing a required security token -- ask the host to resend it.';
                return;
            }

            joinBtn.disabled = true;
            status.textContent = 'Connecting...';

            const code = document.getElementById('joinCode').value.trim();
            const displayName = document.getElementById('displayName').value.trim();

            const { deriveConnectKey, generateEphemeralKeyPair } = await loadCollabCrypto();
            connectKey = await deriveConnectKey(handshakeSecret, sessionId);
            keyPair = await generateEphemeralKeyPair();

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}/ws/session/${sessionId}`);

            socket.addEventListener('open', () => {
                socket.send(JSON.stringify({ type: 'join', code, display_name: displayName }));
            });

            socket.addEventListener('message', async (event) => {
                let parsed = null;
                try { parsed = JSON.parse(event.data); } catch (error) { parsed = null; }

                if (parsed && parsed.type === 'joined') {
                    // The #963 admission ack -- not part of #964's
                    // encryption envelope scheme (it's not one of
                    // classifyFrameType's known types), so it's handled
                    // here, separately, before that check.
                    status.textContent = `Joined as ${parsed.display_name}.`;
                    relay.style.display = 'block';
                    // #967: the plan is the point of the page once you're
                    // in -- the join form has done its job and would just
                    // push the tasks below the fold.
                    form.hidden = true;
                    document.querySelector('p.sub').hidden = true;
                    // #966: start the presence heartbeat now that we're
                    // admitted -- see PRESENCE_PING_INTERVAL_MS above.
                    stopPresencePing();
                    presencePingTimer = setInterval(() => {
                        if (socket && socket.readyState === WebSocket.OPEN) {
                            socket.send(JSON.stringify({ type: 'presence_ping' }));
                        }
                    }, PRESENCE_PING_INTERVAL_MS);
                    return;
                }

                const { classifyFrameType, parsePubkeyAnnouncement, buildPubkeyAnnouncement, deriveSessionKey, decryptMessage } =
                    await loadCollabCrypto();
                const frameType = classifyFrameType(event.data);

                if (frameType === 'host_pubkey') {
                    const peerKey = await parsePubkeyAnnouncement('host_pubkey', connectKey, event.data);
                    if (!peerKey) {
                        // MAC didn't verify -- our handshakeSecret doesn't
                        // match the host's (e.g. an incomplete/corrupted
                        // link), or this announcement was forged by
                        // something that doesn't have handshakeSecret
                        // (e.g. the relay itself -- see collab-crypto.js's
                        // module docstring). Never derive a session key
                        // with an unauthenticated peer.
                        status.textContent = 'Could not establish a secure channel -- ask the host to resend the join link.';
                        socket.close();
                        joinBtn.disabled = false;
                        return;
                    }
                    sessionKey = await deriveSessionKey(keyPair.privateKey, peerKey, sessionId);
                    log('(secure channel established)');
                    // Announce our own ephemeral public key back to the
                    // host so it can derive the same session key.
                    const announcement = await buildPubkeyAnnouncement('joiner_pubkey', connectKey, keyPair);
                    socket.send(announcement);
                    return;
                }

                if (frameType === 'enc') {
                    if (!sessionKey) {
                        log('(received an encrypted message before the secure channel was ready)');
                        return;
                    }
                    try {
                        const plaintext = await decryptMessage(sessionKey, event.data, sessionId);
                        // #967: the host's authoritative plan, or its reply
                        // to an op we sent. Anything else is ordinary
                        // chatter and still just gets logged.
                        let parsed = null;
                        try { parsed = JSON.parse(plaintext); } catch (e) { parsed = null; }
                        if (parsed && parsed.type === 'plan_snapshot') {
                            renderPlanSnapshot(parsed);
                            return;
                        }
                        if (parsed && parsed.type === 'plan_op_rejected') {
                            // A stale op means someone else's edit landed
                            // first and our snapshot was out of date; the
                            // newer snapshot is already on its way, so this
                            // explains the bounce rather than being an error.
                            showPlanNotice(parsed.reason === 'stale'
                                ? 'That task changed while you were editing — try again.'
                                : 'The host could not apply that change.');
                            return;
                        }
                        if (parsed && parsed.type === 'raid_snapshot') {
                            renderRaidSnapshot(parsed);
                            return;
                        }
                        if (parsed && parsed.type === 'backmatter_snapshot') {
                            // #1036: benefits and comms. One frame type
                            // carrying the section name, so a fourth
                            // section needs no new frame type here.
                            renderSectionSnapshot(parsed);
                            return;
                        }
                        if (parsed && parsed.type === 'backmatter_op_rejected') {
                            // #969: the RAID counterpart of plan_op_rejected
                            // above -- 'unknown_row' means someone else
                            // deleted or renamed it out from under us.
                            showPlanNotice(parsed.reason === 'unknown_row'
                                ? 'That RAID item changed while you were editing — try again.'
                                : 'The host could not apply that change.');
                            return;
                        }
                        log(`host: ${plaintext}`);
                    } catch (error) {
                        log('(failed to decrypt a message -- dropped)');
                    }
                    return;
                }

                // Anything else is an unrecognized frame. Security review
                // finding: this used to fall through to displaying the raw
                // payload with the same log format as genuine decrypted
                // content -- meaning anyone who could write a frame into
                // this socket (trivially, the relay itself) could inject a
                // message that looked exactly like a real one from the
                // host, no decryption or authentication required. Never
                // display unrecognized frames as if they were peer
                // content; just note one arrived and drop it.
                log('(received an unrecognized message -- ignored)');
            });

            socket.addEventListener('close', (event) => {
                const wasJoined = relay.style.display === 'block';

                // #965: tear down every bit of client-side session state on
                // any close, whatever the cause -- host ended it, host
                // disconnected, idle timeout, kicked (#966), or a plain
                // network drop -- so nothing (socket, keys, decrypted log)
                // lingers after the fact, and so the join form is always
                // ready to be resubmitted to rejoin.
                stopPresencePing();
                socket = null;
                sessionKey = null;
                keyPair = null;
                connectKey = null;
                relay.style.display = 'none';
                relayLog.innerHTML = '';
                joinBtn.disabled = false;
                // Put the join form back -- #965's promise is that any
                // close leaves this page ready to rejoin.
                form.hidden = false;
                document.querySelector('p.sub').hidden = false;
                // #967: the plan came from the host and is theirs, not
                // ours -- drop it with the rest of the session state rather
                // than leaving a stale copy on screen after disconnect.
                planTasks = [];
                planRev = 0;
                clearTimeout(planNoticeTimer);
                const planContainer = document.getElementById('planTasks');
                if (planContainer) planContainer.innerHTML = '';
                const planNoticeEl = document.getElementById('planNotice');
                if (planNoticeEl) planNoticeEl.hidden = true;
                // #969: the RAID log is the host's too -- drop it on
                // disconnect along with the rest of the session state.
                raidRows = [];
                raidRev = 0;
                const raidContainer = document.getElementById('raidRows');
                if (raidContainer) raidContainer.innerHTML = '';

                if (!wasJoined) {
                    status.textContent = 'Could not join -- check the code and try again.';
                    return;
                }

                // `event.reason` is set whenever the server tore the
                // session down itself (see collab_session.py's CLOSE_*
                // constants) -- e.g. "Host ended the session.",
                // "Host disconnected.", "Session expired after being idle
                // too long." -- letting this page show a specific
                // explanation instead of one generic message. A reason-less
                // close (e.g. this browser's own network dropping) falls
                // back to a generic explanation that still invites a rejoin.
                status.textContent = event.reason
                    ? `${event.reason} Enter the code again to rejoin.`
                    : 'Lost connection to the session. Enter the code again to rejoin.';
            });
        });

        // #967: add a task. Sent with no parent, so it lands at the end of
        // the plan -- picking a parent is a structural choice the host's own
        // outline is better at, and #970's whiteboard interface is where
        // joiner-side structure editing belongs.
        function submitNewTask() {
            const input = document.getElementById('newTaskName');
            const name = input.value.trim();
            if (!name) return;
            sendPlanOp({ op: 'add_task', parent_id: null, name });
            input.value = '';
        }
        document.getElementById('addTaskBtn').addEventListener('click', submitNewTask);
        document.getElementById('newTaskName').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') { event.preventDefault(); submitNewTask(); }
        });

        // #969: add a RAID row. Lands with the type/status defaults
        // applyBackmatterOp gives a fresh row (risk, open) -- refining
        // those is what the per-row dropdowns rendered above are for.
        function submitNewRaidRow() {
            const input = document.getElementById('newRaidTitle');
            const title = input.value.trim();
            if (!title) return;
            sendBackmatterOp({ op: 'add_row', fields: { title } });
            input.value = '';
        }
        document.getElementById('addRaidBtn').addEventListener('click', submitNewRaidRow);
        document.getElementById('newRaidTitle').addEventListener('keydown', (event) => {
            if (event.key === 'Enter') { event.preventDefault(); submitNewRaidRow(); }
        });

        // #1036: the same "add a row" wiring for benefits and comms, driven
        // by SECTION_UI so a fourth section needs no new handler.
        for (const [section, config] of Object.entries(SECTION_UI)) {
            const capital = section.charAt(0).toUpperCase() + section.slice(1);
            const input = document.getElementById(`new${capital}Title`);
            const button = document.getElementById(`add${capital}Btn`);
            if (!input || !button) continue;

            const submit = () => {
                const value = input.value.trim();
                if (!value) return;
                sendSectionOp(section, { op: 'add_row', fields: { [config.titleField]: value } });
                input.value = '';
            };
            button.addEventListener('click', submit);
            input.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') { event.preventDefault(); submit(); }
            });
        }

        document.getElementById('relaySend').addEventListener('click', async () => {
            const input = document.getElementById('relayInput');
            if (!socket || socket.readyState !== WebSocket.OPEN || !input.value) return;
            if (!sessionKey) {
                log('(cannot send yet -- secure channel not established)');
                return;
            }
            const { encryptMessage } = await loadCollabCrypto();
            const envelope = await encryptMessage(sessionKey, input.value, sessionId);
            socket.send(envelope);
            log(`you: ${input.value}`);
            input.value = '';
        });
    </script>
</body>
</html>
