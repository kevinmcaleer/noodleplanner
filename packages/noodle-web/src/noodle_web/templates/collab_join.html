<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join planning session - Noodle Planner</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --muted: #6b7280;
            --border: #d8dce1;
            --accent: #667eea;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14161a;
                --card-bg: #1e2126;
                --text: #eef0f3;
                --muted: #9aa1ab;
                --border: #33373f;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }
        h1 { font-size: 1.4rem; margin: 0 0 4px; }
        p.sub { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--muted); }
        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            font-size: 1rem;
        }
        input#joinCode { letter-spacing: 0.3em; font-variant-numeric: tabular-nums; }
        button {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: default; }
        #status { margin-top: 16px; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
        #relay { margin-top: 20px; display: none; }
        #relayLog {
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 140px;
            overflow-y: auto;
            padding: 8px;
            font-size: 0.8rem;
            font-family: ui-monospace, monospace;
        }
        .row { display: flex; gap: 8px; margin-top: 8px; }
        .row input { margin-bottom: 0; }
        .row button { width: auto; padding: 8px 14px; }

        /* #967: the minimal live-editing task list -- deliberately plain,
           see this page's own module docstring below and #970 (blocked on
           #783(A)) for the eventual polished replacement. */
        #planSection { margin-top: 20px; display: none; }
        #planSection h2 { font-size: 1rem; margin: 0 0 8px; }
        #planConflictBanner {
            display: none;
            margin-bottom: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            background: #fef3cd;
            color: #664d03;
            font-size: 0.8rem;
        }
        @media (prefers-color-scheme: dark) {
            #planConflictBanner { background: #4a3c10; color: #ffe69c; }
        }
        #planTaskList { display: flex; flex-direction: column; gap: 6px; }
        .plan-task-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .plan-task-row button {
            width: auto;
            padding: 4px 8px;
            font-size: 0.75rem;
        }
        .plan-task-name {
            background: none;
            border: none;
            color: var(--text);
            padding: 0;
            font-weight: 600;
            font-size: 0.85rem;
            text-align: left;
            flex: 1 0 auto;
            cursor: pointer;
        }
        .plan-task-name:hover { text-decoration: underline; }
        .plan-task-percent { font-size: 0.75rem; color: var(--muted); min-width: 34px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Join planning session</h1>
        <p class="sub">Enter the six-digit code your PM shared with you.</p>

        <form id="joinForm">
            <label for="joinCode">Session code</label>
            <input id="joinCode" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required>

            <label for="displayName">Your name</label>
            <input id="displayName" name="display_name" maxlength="100" placeholder="Alex" required>

            <button type="submit" id="joinBtn">Join session</button>
        </form>
        <div id="status"></div>

        <div id="relay">
            <div id="relayLog"></div>
            <div class="row">
                <input id="relayInput" placeholder="Send a message to the host">
                <button type="button" id="relaySend">Send</button>
            </div>
        </div>

        <!-- #967: minimal live plan editing -- see this file's inline
             script docstring below for the wire format this talks. -->
        <div id="planSection">
            <h2>Plan</h2>
            <div id="planConflictBanner"></div>
            <div id="planTaskList"></div>
            <div class="row">
                <button type="button" id="planAddRootTask">+ Add task</button>
            </div>
        </div>
    </div>

    <script>
        // #964: end-to-end encryption. This inline script stays a classic
        // (non-module) script, so static/collab-crypto.js (an ES module)
        // is loaded via dynamic import() -- same pattern collab-session.js
        // and ribbon.js use for their own ES-module dependencies. See
        // collab-crypto.js's module docstring for the full crypto design
        // (KDF, key exchange, AEAD, wire format, and the two-secret design:
        // the six-digit `code` below is admission-only -- it is what the
        // server checks to let this socket's `join` handshake through, and
        // has zero cryptographic role. The ECDH handshake is instead
        // authenticated by `handshakeSecret`, read below from this page's
        // own URL fragment, which browsers never send to any server).
        //
        // #967 (host-authoritative live plan editing): this is the
        // "deliberately unpolished" minimal joiner UI the issue calls for
        // (#970's full post-it whiteboard replacement is blocked on
        // #783(A), tracked separately) -- a flat task list built from the
        // host's `plan_snapshot` broadcasts, with buttons that send
        // `plan_op` edit intents back. See
        // static/collab-plan-ops.js's module docstring for the full wire
        // format (both message shapes) and the conflict-resolution
        // contract; this page never applies an edit locally, it only
        // renders whatever `plan_snapshot` the host most recently sent --
        // exactly the "authoritative result, not an optimistic local
        // guess" behaviour the issue asks for.
        let cryptoModulePromise = null;
        function loadCollabCrypto() {
            if (!cryptoModulePromise) cryptoModulePromise = import('/static/collab-crypto.js');
            return cryptoModulePromise;
        }

        let myDisplayName = '';
        let planTasks = [];
        let planConflictTimer = null;

        function taskRefOf(task) {
            return { name: task.name, level: task.level };
        }

        /** Build a `plan_op` envelope (see collab-plan-ops.js's module
         * docstring for the shape) crediting this joiner as `actor`. */
        function buildPlanOp(op, fields) {
            return Object.assign(
                { kind: 'plan_op', op_id: Math.random().toString(36).slice(2), op, actor: myDisplayName },
                fields
            );
        }

        /** Encrypt and send a `plan_op` to the host. A no-op if the secure
         * channel isn't up yet -- same guard `sendCollabMessage`-style
         * helpers use elsewhere in this epic (see collab-session.js's
         * `sendCollabMessage`). */
        async function sendPlanOp(op) {
            if (!socket || socket.readyState !== WebSocket.OPEN || !sessionKey) return;
            const { encryptMessage } = await loadCollabCrypto();
            const envelope = await encryptMessage(sessionKey, JSON.stringify(op), sessionId);
            socket.send(envelope);
        }

        function showPlanConflict(conflict) {
            const banner = document.getElementById('planConflictBanner');
            if (!banner || !conflict) return;
            banner.textContent = conflict.message ||
                `${conflict.actor} also edited this — showing the latest version.`;
            banner.style.display = 'block';
            if (planConflictTimer) clearTimeout(planConflictTimer);
            planConflictTimer = setTimeout(() => { banner.style.display = 'none'; }, 6000);
        }

        function buildPlanTaskRow(task) {
            const row = document.createElement('div');
            row.className = 'plan-task-row';
            row.style.marginLeft = `${(task.level - 1) * 16}px`;

            const nameBtn = document.createElement('button');
            nameBtn.type = 'button';
            nameBtn.className = 'plan-task-name';
            nameBtn.textContent = task.name + (task.is_summary ? ' ▸' : '');
            nameBtn.title = 'Click to rename';
            nameBtn.addEventListener('click', () => {
                const next = window.prompt('Rename task', task.name);
                if (next && next.trim() && next.trim() !== task.name) {
                    sendPlanOp(buildPlanOp('set_name', { task: taskRefOf(task), name: next.trim() }));
                }
            });
            row.appendChild(nameBtn);

            const percent = document.createElement('span');
            percent.className = 'plan-task-percent';
            percent.textContent = `${task.percent || 0}%`;
            row.appendChild(percent);

            const dec = document.createElement('button');
            dec.type = 'button';
            dec.textContent = '−10%';
            dec.title = 'Decrease progress';
            dec.addEventListener('click', () => sendPlanOp(buildPlanOp('set_progress', {
                task: taskRefOf(task), value: Math.max(0, (task.percent || 0) - 10),
            })));
            row.appendChild(dec);

            const inc = document.createElement('button');
            inc.type = 'button';
            inc.textContent = '+10%';
            inc.title = 'Increase progress';
            inc.addEventListener('click', () => sendPlanOp(buildPlanOp('set_progress', {
                task: taskRefOf(task), value: Math.min(100, (task.percent || 0) + 10),
            })));
            row.appendChild(inc);

            const complete = document.createElement('button');
            complete.type = 'button';
            complete.textContent = task.percent >= 100 ? '✓ Done' : 'Mark complete';
            complete.disabled = task.percent >= 100;
            complete.addEventListener('click', () => sendPlanOp(buildPlanOp('mark_complete', { task: taskRefOf(task) })));
            row.appendChild(complete);

            const up = document.createElement('button');
            up.type = 'button';
            up.textContent = '▲';
            up.title = 'Move up';
            up.addEventListener('click', () => sendPlanOp(buildPlanOp('reorder_task', { task: taskRefOf(task), direction: 'up' })));
            row.appendChild(up);

            const down = document.createElement('button');
            down.type = 'button';
            down.textContent = '▼';
            down.title = 'Move down';
            down.addEventListener('click', () => sendPlanOp(buildPlanOp('reorder_task', { task: taskRefOf(task), direction: 'down' })));
            row.appendChild(down);

            const addChild = document.createElement('button');
            addChild.type = 'button';
            addChild.textContent = '+ subtask';
            addChild.addEventListener('click', () => {
                const name = window.prompt('New subtask name', 'New Task');
                if (name && name.trim()) sendPlanOp(buildPlanOp('add_task', { parent: taskRefOf(task), name: name.trim() }));
            });
            row.appendChild(addChild);

            return row;
        }

        /** Render the flat task list from the host's most recent
         * `plan_snapshot` -- this page never mutates `planTasks` itself,
         * it only ever replaces the whole array with what the host most
         * recently broadcast (see this script's module docstring). */
        function renderPlanTasks(tasks) {
            planTasks = Array.isArray(tasks) ? tasks : [];
            const section = document.getElementById('planSection');
            const list = document.getElementById('planTaskList');
            if (!section || !list) return;
            section.style.display = 'block';
            list.innerHTML = '';
            planTasks.forEach((task) => list.appendChild(buildPlanTaskRow(task)));
        }

        document.getElementById('planAddRootTask').addEventListener('click', () => {
            const name = window.prompt('New task name', 'New Task');
            if (name && name.trim()) sendPlanOp(buildPlanOp('add_task', { parent: null, name: name.trim() }));
        });

        // The holding link the host shares is `/join/{session_id}#k=<secret>`
        // (see collab_session.py) -- `window.location.hash` is populated by
        // the browser from that fragment and is never part of any request
        // this page (or any page) sends to a server.
        function parseHandshakeSecretFromHash() {
            const hash = window.location.hash || '';
            const params = new URLSearchParams(hash.replace(/^#/, ''));
            return params.get('k');
        }
        const handshakeSecret = parseHandshakeSecretFromHash();

        const sessionId = {{ session_id | tojson }};
        const form = document.getElementById('joinForm');
        const status = document.getElementById('status');
        const joinBtn = document.getElementById('joinBtn');
        const relay = document.getElementById('relay');
        const relayLog = document.getElementById('relayLog');

        function log(line) {
            const div = document.createElement('div');
            div.textContent = line;
            relayLog.appendChild(div);
            relayLog.scrollTop = relayLog.scrollHeight;
        }

        let socket = null;
        let connectKey = null;
        let keyPair = null;
        let sessionKey = null; // established once the host's pubkey is verified
        let presencePingTimer = null;

        // #966: how often this joiner tells the host it's still here, via
        // the lightweight `{"type": "presence_ping"}` heartbeat -- kept
        // well under collab_session.py's PRESENCE_ACTIVE_WINDOW_SECONDS
        // (45s by default) so a couple of missed beats (a backgrounded
        // tab, a slow network) don't flip this joiner to "inactive" in the
        // host's presence panel.
        const PRESENCE_PING_INTERVAL_MS = 15000;

        function stopPresencePing() {
            if (presencePingTimer !== null) {
                clearInterval(presencePingTimer);
                presencePingTimer = null;
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            // Fail closed: without the fragment secret this page cannot
            // authenticate the ECDH handshake at all (see the module
            // docstring note above and collab-crypto.js's for why using
            // `code` here instead would be a serious security bug). Don't
            // even attempt to connect.
            if (!handshakeSecret) {
                status.textContent = 'This join link is missing a required security token -- ask the host to resend it.';
                return;
            }

            joinBtn.disabled = true;
            status.textContent = 'Connecting...';

            const code = document.getElementById('joinCode').value.trim();
            const displayName = document.getElementById('displayName').value.trim();
            // #967: needed outside this handler's scope to credit this
            // joiner's own plan_op sends (see buildPlanOp above).
            myDisplayName = displayName;

            const { deriveConnectKey, generateEphemeralKeyPair } = await loadCollabCrypto();
            connectKey = await deriveConnectKey(handshakeSecret, sessionId);
            keyPair = await generateEphemeralKeyPair();

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}/ws/session/${sessionId}`);

            socket.addEventListener('open', () => {
                socket.send(JSON.stringify({ type: 'join', code, display_name: displayName }));
            });

            socket.addEventListener('message', async (event) => {
                let parsed = null;
                try { parsed = JSON.parse(event.data); } catch (error) { parsed = null; }

                if (parsed && parsed.type === 'joined') {
                    // The #963 admission ack -- not part of #964's
                    // encryption envelope scheme (it's not one of
                    // classifyFrameType's known types), so it's handled
                    // here, separately, before that check.
                    status.textContent = `Joined as ${parsed.display_name}. Waiting for the host...`;
                    relay.style.display = 'block';
                    // #966: start the presence heartbeat now that we're
                    // admitted -- see PRESENCE_PING_INTERVAL_MS above.
                    stopPresencePing();
                    presencePingTimer = setInterval(() => {
                        if (socket && socket.readyState === WebSocket.OPEN) {
                            socket.send(JSON.stringify({ type: 'presence_ping' }));
                        }
                    }, PRESENCE_PING_INTERVAL_MS);
                    return;
                }

                const { classifyFrameType, parsePubkeyAnnouncement, buildPubkeyAnnouncement, deriveSessionKey, decryptMessage } =
                    await loadCollabCrypto();
                const frameType = classifyFrameType(event.data);

                if (frameType === 'host_pubkey') {
                    const peerKey = await parsePubkeyAnnouncement('host_pubkey', connectKey, event.data);
                    if (!peerKey) {
                        // MAC didn't verify -- our handshakeSecret doesn't
                        // match the host's (e.g. an incomplete/corrupted
                        // link), or this announcement was forged by
                        // something that doesn't have handshakeSecret
                        // (e.g. the relay itself -- see collab-crypto.js's
                        // module docstring). Never derive a session key
                        // with an unauthenticated peer.
                        status.textContent = 'Could not establish a secure channel -- ask the host to resend the join link.';
                        socket.close();
                        joinBtn.disabled = false;
                        return;
                    }
                    sessionKey = await deriveSessionKey(keyPair.privateKey, peerKey, sessionId);
                    log('(secure channel established)');
                    // Announce our own ephemeral public key back to the
                    // host so it can derive the same session key.
                    const announcement = await buildPubkeyAnnouncement('joiner_pubkey', connectKey, keyPair);
                    socket.send(announcement);
                    return;
                }

                if (frameType === 'enc') {
                    if (!sessionKey) {
                        log('(received an encrypted message before the secure channel was ready)');
                        return;
                    }
                    try {
                        const plaintext = await decryptMessage(sessionKey, event.data, sessionId);
                        let content = null;
                        try { content = JSON.parse(plaintext); } catch { content = null; }

                        // #967: the host's authoritative plan state -- see
                        // collab-plan-ops.js's module docstring for the
                        // wire format. Anything else (including plain old
                        // demo text) falls through to the original
                        // behaviour below, unchanged.
                        if (content && typeof content === 'object' && content.kind === 'plan_snapshot') {
                            renderPlanTasks(content.tasks);
                            if (content.conflict) showPlanConflict(content.conflict);
                            return;
                        }

                        log(`host: ${plaintext}`);
                    } catch (error) {
                        log('(failed to decrypt a message -- dropped)');
                    }
                    return;
                }

                // Anything else is an unrecognized frame. Security review
                // finding: this used to fall through to displaying the raw
                // payload with the same log format as genuine decrypted
                // content -- meaning anyone who could write a frame into
                // this socket (trivially, the relay itself) could inject a
                // message that looked exactly like a real one from the
                // host, no decryption or authentication required. Never
                // display unrecognized frames as if they were peer
                // content; just note one arrived and drop it.
                log('(received an unrecognized message -- ignored)');
            });

            socket.addEventListener('close', (event) => {
                const wasJoined = relay.style.display === 'block';

                // #965: tear down every bit of client-side session state on
                // any close, whatever the cause -- host ended it, host
                // disconnected, idle timeout, kicked (#966), or a plain
                // network drop -- so nothing (socket, keys, decrypted log)
                // lingers after the fact, and so the join form is always
                // ready to be resubmitted to rejoin.
                stopPresencePing();
                socket = null;
                sessionKey = null;
                keyPair = null;
                connectKey = null;
                relay.style.display = 'none';
                relayLog.innerHTML = '';
                joinBtn.disabled = false;

                // #967: this joiner's plan view is only ever as fresh as
                // the last snapshot the host sent -- once disconnected,
                // stop showing it as if it were still live. A rejoin gets
                // a fresh catch-up snapshot from the host (see
                // collab-session.js's collabSendCatchUpSnapshot).
                planTasks = [];
                const planSection = document.getElementById('planSection');
                if (planSection) planSection.style.display = 'none';
                const planTaskList = document.getElementById('planTaskList');
                if (planTaskList) planTaskList.innerHTML = '';
                const planConflictBanner = document.getElementById('planConflictBanner');
                if (planConflictBanner) planConflictBanner.style.display = 'none';
                if (planConflictTimer) {
                    clearTimeout(planConflictTimer);
                    planConflictTimer = null;
                }

                if (!wasJoined) {
                    status.textContent = 'Could not join -- check the code and try again.';
                    return;
                }

                // `event.reason` is set whenever the server tore the
                // session down itself (see collab_session.py's CLOSE_*
                // constants) -- e.g. "Host ended the session.",
                // "Host disconnected.", "Session expired after being idle
                // too long." -- letting this page show a specific
                // explanation instead of one generic message. A reason-less
                // close (e.g. this browser's own network dropping) falls
                // back to a generic explanation that still invites a rejoin.
                status.textContent = event.reason
                    ? `${event.reason} Enter the code again to rejoin.`
                    : 'Lost connection to the session. Enter the code again to rejoin.';
            });
        });

        document.getElementById('relaySend').addEventListener('click', async () => {
            const input = document.getElementById('relayInput');
            if (!socket || socket.readyState !== WebSocket.OPEN || !input.value) return;
            if (!sessionKey) {
                log('(cannot send yet -- secure channel not established)');
                return;
            }
            const { encryptMessage } = await loadCollabCrypto();
            const envelope = await encryptMessage(sessionKey, input.value, sessionId);
            socket.send(envelope);
            log(`you: ${input.value}`);
            input.value = '';
        });
    </script>
</body>
</html>
