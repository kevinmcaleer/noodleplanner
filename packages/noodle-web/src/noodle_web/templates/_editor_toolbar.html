<div class="editor-toolbar ribbon-toolbar" id="projectRibbon" role="toolbar" aria-label="Project ribbon toolbar">
    <div class="ribbon-view-tabs">
        <div class="ribbon-view-group active" data-ribbon-scope="default" role="tablist" aria-label="Project views">
            <button class="ribbon-tab active" data-view="project-report" onclick="switchPlanSubnavToDashboard()">Dashboard</button>
            <button class="ribbon-tab" data-view="tasks" onclick="switchToView('tasks')">Tasks</button>
            <button class="ribbon-tab" data-view="gantt" onclick="switchToView('gantt')">Gantt</button>
            <button class="ribbon-tab" data-view="kanban" onclick="switchPlanSubnavToBoard()">Board</button>
            <button class="ribbon-tab" data-view="raid" onclick="switchToView('raid')">RAID</button>
            <button class="ribbon-tab" data-view="comms" onclick="switchToView('comms')">Comms</button>
        </div>
        <div class="ribbon-view-group" data-ribbon-scope="gantt" role="tablist" aria-label="Gantt view tabs">
            <button class="ribbon-tab" data-view="tasks" onclick="switchToView('tasks')">Tasks</button>
            <button class="ribbon-tab" data-view="gantt" onclick="switchToView('gantt')">Gantt</button>
            <button class="ribbon-tab" data-view="calendar" onclick="switchToView('calendar')">Calendar</button>
            <button class="ribbon-tab" data-view="milestones" onclick="switchToView('milestones')">Milestones</button>
            <button class="ribbon-tab" data-view="timeline" onclick="switchToView('timeline')">Timeline</button>
        </div>
        <div class="ribbon-view-group" data-ribbon-scope="board" role="tablist" aria-label="Board view tabs">
            <button class="ribbon-tab" data-view="tasks" onclick="switchToView('tasks')">Tasks</button>
            <button class="ribbon-tab" data-view="kanban" onclick="switchPlanSubnavToBoard()">Board</button>
            <button class="ribbon-tab" data-view="mindmap" onclick="switchToView('mindmap')">Mind Map</button>
            <button class="ribbon-tab" data-view="deliverables" onclick="switchToView('deliverables')">Deliverables</button>
        </div>
        <div class="ribbon-view-group" data-ribbon-scope="tracking" role="tablist" aria-label="Tracking view tabs">
            <button class="ribbon-tab" data-view="raid" onclick="switchToView('raid')">RAID Log</button>
            <button class="ribbon-tab" data-view="actions" onclick="switchToView('actions')">Actions</button>
            <button class="ribbon-tab" data-view="highlights" onclick="switchToView('highlights')">Highlights</button>
            <button class="ribbon-tab" data-view="lookahead" onclick="switchToView('lookahead')">Look-Ahead</button>
            <button class="ribbon-tab" data-view="analysis" onclick="switchToView('analysis')">Analysis</button>
            <button class="ribbon-tab" data-view="budget" onclick="switchToView('budget')">Budget</button>
            <button class="ribbon-tab" data-view="evm" onclick="switchToView('evm')">EVM</button>
            <button class="ribbon-tab" data-view="comms" onclick="switchToView('comms')">Comms Plan</button>
            <button class="ribbon-tab" data-view="lessons" onclick="switchToView('lessons')">Lessons</button>
        </div>
    </div>
    <div class="ribbon-actions" role="group" aria-label="Editor actions">
        <button id="undoBtn" class="ribbon-action-btn" onclick="EditorUndoManager.undo()" title="Undo (Ctrl+Z)" disabled>
            <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i><span>Undo</span>
        </button>
        <button id="redoBtn" class="ribbon-action-btn" onclick="EditorUndoManager.redo()" title="Redo (Ctrl+Shift+Z)" disabled>
            <i class="bi bi-arrow-clockwise" aria-hidden="true"></i><span>Redo</span>
        </button>
        <span class="ribbon-separator" aria-hidden="true"></span>
        <button class="ribbon-action-btn" onclick="outdentSelectedLines()" title="Outdent selected lines (Cmd+[)">
            <i class="bi bi-text-indent-right" aria-hidden="true"></i><span>Outdent</span>
        </button>
        <button class="ribbon-action-btn" onclick="indentSelectedLines()" title="Indent selected lines (Cmd+])">
            <i class="bi bi-text-indent-left" aria-hidden="true"></i><span>Indent</span>
        </button>
        <button class="ribbon-action-btn" onclick="linkSelectedTasks()" title="Link selected tasks as dependencies (top to bottom)">
            <i class="bi bi-link-45deg" aria-hidden="true"></i><span>Link</span>
        </button>
        <button class="ribbon-action-btn" onclick="openTaskInspectorForCurrentLine()" title="Task Inspector - inspect the selected task">
            <i class="bi bi-search" aria-hidden="true"></i><span>Inspect</span>
        </button>
        <span class="ribbon-separator" aria-hidden="true"></span>
        <button class="ribbon-action-btn" onclick="uploadPlanFile()" title="Upload a plan file">
            <i class="bi bi-upload" aria-hidden="true"></i><span>Upload</span>
        </button>
        <button class="ribbon-action-btn" onclick="downloadMarkdown()" title="Download as Markdown">
            <i class="bi bi-download" aria-hidden="true"></i><span>Download</span>
        </button>
        <button class="ribbon-action-btn" onclick="openConditionalFormattingPanel()" title="Conditional Formatting">
            <i class="bi bi-palette" aria-hidden="true"></i><span>Formatting</span>
        </button>
        <button class="ribbon-action-btn" onclick="renderText()" title="Refresh plan render">
            <i class="bi bi-arrow-repeat" aria-hidden="true"></i><span>Refresh</span>
        </button>
    </div>
</div>
