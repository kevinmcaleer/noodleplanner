<div class="editor-toolbar">
    <button id="undoBtn" class="toolbar-btn" onclick="EditorUndoManager.undo()" title="Undo (Ctrl+Z)" disabled>
        <i class="bi bi-arrow-counterclockwise"></i>
    </button>
    <button id="redoBtn" class="toolbar-btn" onclick="EditorUndoManager.redo()" title="Redo (Ctrl+Shift+Z)" disabled>
        <i class="bi bi-arrow-clockwise"></i>
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" onclick="outdentSelectedLines()" title="Outdent selected lines (Cmd+[)">
        ⇤
    </button>
    <button class="toolbar-btn" onclick="indentSelectedLines()" title="Indent selected lines (Cmd+])">
        ⇥
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" onclick="linkSelectedTasks()" title="Link selected tasks as dependencies (top to bottom)">
        🔗
    </button>
    <button class="toolbar-btn" onclick="openTaskInspectorForCurrentLine()" title="Task Inspector - inspect the selected task">
        🔍
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" onclick="uploadPlanFile()" title="Upload a plan file">
        📁
    </button>
    <button class="toolbar-btn" id="openLocalFileBtn" onclick="openLocalPlanFile()" title="Open a .md file from disk (links Save to it on Chromium/Edge — no re-prompt)">
        <i class="bi bi-folder2-open"></i>
    </button>
    <button class="toolbar-btn" id="saveMarkdownBtn" onclick="downloadMarkdown()" title="Save (writes to the linked file, or downloads a copy)">
        💾
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" onclick="openConditionalFormattingPanel()" title="Conditional Formatting">
        🎨
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" onclick="renderText()" title="Refresh plan render">
        <i class="bi bi-arrow-clockwise"></i>
    </button>
</div>
