services:
  # Cloudflare tunnel — exposes native Ollama via a subdomain.
  # Requires Ollama running natively on the host (ollama serve).
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ollama-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
