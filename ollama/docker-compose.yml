services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ${OLLAMA_DATA:-./data}:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Pulls the model on first run, then exits. Skips if already downloaded.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2}"]
    environment:
      - OLLAMA_HOST=ollama:11434
    restart: "no"

  # Cloudflare tunnel — exposes Ollama via a subdomain
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ollama-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
