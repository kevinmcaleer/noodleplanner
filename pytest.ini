[pytest]
# Pytest configuration for Noodle Planner

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    # Selenium tests drive a real headless Chrome: ~240 tests that take
    # ~16 minutes, against ~1600 non-browser tests that take ~8 seconds.
    # They are deselected by default so the everyday run is a fast one.
    #   uv run pytest                  -- everything except the browser tests
    #   uv run pytest -m usability     -- only the browser tests
    #   uv run pytest -m ""            -- everything
    -m "not usability"
    --tb=short
    # Coverage options (requires pytest-cov):
    # --cov=.
    # --cov-report=term-missing
    # --cov-report=html
    # --cov-config=.coveragerc

# Markers for organizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for components
    api: API endpoint tests
    slow: Tests that take longer to run
    edge_case: Edge case and boundary condition tests
    usability: Selenium-based browser usability tests

# Coverage exclusions
[coverage:run]
omit =
    */tests/*
    */venv/*
    */env/*
    */__pycache__/*
    */site-packages/*
    setup.py
    */migrations/*

[coverage:report]
# Target: 80% code coverage per CLAUDE.md
fail_under = 80
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
