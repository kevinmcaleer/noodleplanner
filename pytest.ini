[pytest]
# Pytest configuration for Noodle Planner

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    # The browser-driven suites are deselected by default so the everyday
    # local run is seconds rather than minutes. Selection matches
    # ci/jobs/python.sh exactly -- `not ui` keeps a checkout without a
    # Playwright browser from reporting a screenful of skips.
    #   uv run pytest                  -- everything except the browser suites
    #   uv run pytest -m usability     -- the Selenium suite
    #   uv run pytest tests/ui         -- the Playwright suite
    #   uv run pytest -m ""            -- everything
    # A -m on the command line overrides this, which is how ci/jobs/*.sh
    # still select their own suites.
    -m "not usability and not ui"
    --tb=short
    # Coverage options (requires pytest-cov):
    # --cov=.
    # --cov-report=term-missing
    # --cov-report=html
    # --cov-config=.coveragerc

# Markers for organizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for components
    api: API endpoint tests
    slow: Tests that take longer to run
    edge_case: Edge case and boundary condition tests
    usability: Selenium-based browser usability tests
    ui: Playwright-based browser UI tests (tests/ui)
    external_assets: needs the real CDN/Google Fonts, not just a local server
    unstable: exposes a known unfixed app defect; deselected from the gating run

# Coverage exclusions
[coverage:run]
omit =
    */tests/*
    */venv/*
    */env/*
    */__pycache__/*
    */site-packages/*
    setup.py
    */migrations/*

[coverage:report]
# Target: 80% code coverage per CLAUDE.md
fail_under = 80
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
