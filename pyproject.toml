[tool.uv.workspace]
members = [
    "packages/noodle-core",
    "packages/noodle-cli",
    "packages/noodle-web"
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.4.1",
    "pytest-cov>=7.0.0",
    "httpx",
    "xlwt>=1.3.0",
    "selenium>=4.25.0",
    "webdriver-manager>=4.0.2",
    # The Playwright UI suite (tests/ui). It is replacing the Selenium browser
    # tests file by file -- see tests/ui/README.md -- so both drivers are
    # dev dependencies until the last tests/test_*.py Selenium file is ported.
    # Needs a browser as well as the package: `uv run playwright install chromium`.
    "pytest-playwright>=0.5.0",
    # tests/ui is isolated per test (a browser context each), so it parallelises
    # cleanly; `-n auto` is roughly another 2x on a 4-core machine.
    "pytest-xdist>=3.6.0",
    # Dev-only: used exclusively by tests/helpers/collab_crypto_stub.py, a
    # Python port of static/collab-crypto.js (#964) that drives the
    # server-side relay-opacity test. Production encryption/decryption for
    # real collab sessions runs entirely in the browser via the native
    # SubtleCrypto API -- the app itself never imports `cryptography`.
    "cryptography>=42.0.0",
    # Dev-only: a real WebSocket *client*, used by tests/test_collab_load.py
    # (#971) to put 10+ genuinely concurrent joiners on one session against a
    # real uvicorn server. Starlette's TestClient runs each socket through its
    # own blocking portal, which is exactly the arrangement that deadlocks
    # under concurrency (see that file's docstring), so it cannot answer the
    # "does the relay hold up with a room full of people" question this issue
    # asks. The app itself never imports this.
    "websockets>=12.0",
]
